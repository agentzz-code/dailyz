<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dailyz</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f7;
    color: #111;
    transition: .2s;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(700px, calc(100% - 32px));
    margin: auto;
    padding: 25px 0 50px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
}

.date {
    margin-top: 5px;
    color: #777;
    font-size: 14px;
}

.header-buttons {
    display: flex;
    gap: 8px;
    align-items: center;
}

.icon-button {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #e5e5e7;
    font-size: 20px;
}

/* AUTH */

.auth-card {
    width: 100%;
    padding: 24px;
    margin-bottom: 22px;
    border-radius: 18px;
    background: white;
}

.auth-card h2 {
    margin: 0 0 7px;
}

.auth-subtitle {
    margin-bottom: 18px;
    color: #777;
    font-size: 14px;
}

.auth-input {
    width: 100%;
    height: 48px;
    padding: 0 13px;
    margin-bottom: 9px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

.auth-button {
    width: 100%;
    height: 48px;
    margin-top: 4px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-weight: 700;
}

.auth-switch {
    margin-top: 13px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

.auth-switch button {
    border: 0;
    background: none;
    color: #111;
    font-weight: 700;
}

.auth-error {
    display: none;
    margin-bottom: 10px;
    color: #d00;
    font-size: 13px;
}

.user-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 12px;
    background: white;
}

.user-email {
    max-width: 70%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #666;
    font-size: 13px;
}

.logout-button {
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    background: #eee;
    font-weight: 600;
}

/* TABS */

.tabs {
    display: flex;
    gap: 5px;
    padding: 5px;
    margin-bottom: 22px;
    border-radius: 13px;
    background: #e5e5e7;
}

.tab {
    flex: 1;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    background: transparent;
    color: #666;
    font-weight: 600;
}

.tab.active {
    background: white;
    color: #111;
}

/* SECTIONS */

.section {
    display: none;
}

.section.active {
    display: block;
}

/* TASK INPUT */

.task-input {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

#taskInput {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    background: white;
    font-size: 16px;
}

.add-button {
    width: 52px;
    height: 52px;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 28px;
}

/* TASKS */

#taskList {
    display: flex;
    flex-direction: column;
    gap: 9px;
    width: 100%;
}

.task-row {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 54px;
    padding: 12px 14px;
    border-radius: 13px;
    background: white;
}

.task-check {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    margin: 0 12px 0 0;
}

.task-label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.task-row.done .task-label {
    text-decoration: line-through;
    opacity: .45;
}

.delete-task {
    width: 30px;
    height: 30px;
    margin-left: 8px;
    border: 0;
    background: transparent;
    font-size: 20px;
}

.no-tasks {
    padding: 35px 10px;
    text-align: center;
    color: #888;
}

/* PRAYERS */

.prayer-header {
    margin-bottom: 18px;
}

.prayer-header h2 {
    margin: 0 0 5px;
}

.location {
    color: #777;
    font-size: 14px;
}

.next-prayer {
    padding: 23px;
    margin-bottom: 18px;
    border-radius: 18px;
    background: #111;
    color: white;
}

.next-label {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: .6;
}

.next-name {
    margin-top: 5px;
    font-size: 28px;
    font-weight: 700;
}

.next-time {
    margin-top: 2px;
    font-size: 38px;
    font-weight: 700;
}

#prayerList {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.prayer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 52px;
    padding: 15px 16px;
    border-radius: 12px;
    background: white;
}

/* SETTINGS */

.settings-card {
    margin-top: 20px;
    padding: 19px;
    border-radius: 16px;
    background: white;
}

.settings-title {
    margin-bottom: 13px;
    font-weight: 700;
}

.location-row {
    display: flex;
    gap: 8px;
}

#locationInput {
    flex: 1;
    min-width: 0;
    height: 45px;
    padding: 0 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
}

.small-button,
.notification-button {
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-weight: 600;
}

.small-button {
    height: 45px;
    padding: 0 16px;
}

.notification-button {
    width: 100%;
    height: 45px;
    margin-top: 11px;
}

.status {
    margin-top: 9px;
    color: #777;
    font-size: 13px;
}

/* DARK */

body.dark {
    background: #111214;
    color: white;
}

body.dark .icon-button,
body.dark .tabs {
    background: #292a2f;
    color: white;
}

body.dark .tab {
    color: #aaa;
}

body.dark .tab.active {
    background: #383a40;
    color: white;
}

body.dark .auth-card,
body.dark .user-bar,
body.dark .task-row,
body.dark .prayer-row,
body.dark .settings-card {
    background: #1d1f23;
}

body.dark .auth-input,
body.dark #taskInput,
body.dark #locationInput {
    background: #292b30;
    color: white;
    border-color: #3b3d43;
}

body.dark .user-email,
body.dark .auth-subtitle,
body.dark .location,
body.dark .status {
    color: #999;
}

body.dark .logout-button {
    background: #383a40;
    color: white;
}

body.dark .next-prayer {
    background: #292b30;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div>
            <div class="logo">Dailyz</div>
            <div class="date" id="date"></div>
        </div>

        <div class="header-buttons">

            <button
                class="icon-button"
                id="themeButton"
                type="button"
            >☾</button>

        </div>

    </div>


    <!-- AUTH -->

    <div
        class="auth-card"
        id="authCard"
    >

        <h2 id="authTitle">Sign in</h2>

        <div class="auth-subtitle">
            Sign in to save your Dailyz tasks to your account.
        </div>

            id="authError"
        ></div>

        <input
            class="auth-input"
            id="emailInput"
            type="email"

        >

        <input
            class="auth-input"
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="auth-button"
            id="authButton"
            type="button"
        >
            Sign In
        </button>

        <div class="auth-switch">

            <span id="switchText">

    </div>


    <!-- USER BAR -->

    <div

        id="userBar"
    >

        </button>

        <button

        </button>

    </div>


    <!-- TASKS -->

    <div
        class="section active"

    >

        <div class="task-input">

            <input
                id="taskInput"
                type="text"
                placeholder="Add a task..."
                autocomplete="off"

            >
                +

    <!-- PRAYERS -->

    <div
        class="section"
        id="prayers"

            >

            <div class="settings-title">

                <input
                    id="locationInput"
                    type="text"
                    value="Erbil, Iraq"
                    placeholder="City, Country"
                >

                <button
                    id="updateLocationButton"
                    class="small-button"
                    type="button"
                >
                    Update
                </button>

                id="notificationButton"
                class="notification-button"
                type="button"

                🔔 Enable Prayer Notifications
            </button>

            <div

            >
                Notifications are disabled.
            </div>

    </div>

</div>


<script type="module">

/* ============================================
   FIREBASE
============================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    onSnapshot,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBZs-JcWpgc9LHbhMJT9l5AdTBvYOEFMZ8",

    authDomain:
        "dailyz-web.firebaseapp.com",

    projectId:
        "dailyz-web",

    storageBucket:
        "dailyz-web.firebasestorage.app",

    messagingSenderId:
        "1031947329415",

    appId:
        "1:1031947329415:web:475f3f0d7449992fc73d22"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* ============================================
   VARIABLES
============================================ */

let currentUser = null;

let unsubscribeTasks = null;

let signUpMode = false;


/* ============================================
   DATE
============================================ */

function updateDate() {

    document.getElementById("date").textContent =
        new Date().toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );
}


/* ============================================
   AUTH UI
============================================ */

function showAuthError(message) {

    const error =
        document.getElementById("authError");

    error.textContent = message;

    error.style.display = "block";
}


function clearAuthError() {

    const error =
        document.getElementById("authError");

    error.textContent = "";

    error.style.display = "none";
}


function updateAuthUI() {

    const title =
        document.getElementById("authTitle");

    const button =
        document.getElementById("authButton");

    const switchText =
        document.getElementById("switchText");

    const switchButton =
        document.getElementById(
            "switchAuthButton"
        );


    if (signUpMode) {

        title.textContent =
            "Create account";

        button.textContent =
            "Sign Up";

        switchText.textContent =
            "Already have an account?";

        switchButton.textContent =
            "Sign In";

    } else {

        title.textContent =
            "Sign in";

        button.textContent =
            "Sign In";

        switchText.textContent =
            "Don't have an account?";

        switchButton.textContent =
            "Sign Up";

    }
}


/* ============================================
   SIGN UP / SIGN IN
============================================ */

async function handleAuth() {

    clearAuthError();


    const email =
        document
            .getElementById("emailInput")
            .value
            .trim();


    const password =
        document
            .getElementById("passwordInput")
            .value;


    if (!email || !password) {

        showAuthError(
            "Enter your email and password."
        );

        return;
    }


    if (password.length < 6) {

        showAuthError(
            "Password must be at least 6 characters."
        );

        return;
    }


    const button =
        document.getElementById(
            "authButton"
        );


    button.disabled = true;


    try {

        if (signUpMode) {

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

    } catch (error) {

        console.error(error);


        let message =
            "Something went wrong.";


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            message =
                "That email already has an account.";

        } else if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
                "Enter a valid email.";

        } else if (
            error.code ===
            "auth/invalid-credential"
        ) {

            message =
                "Incorrect email or password.";

        } else if (
            error.code ===
            "auth/user-not-found"
        ) {

            message =
                "No account exists with that email.";

        } else if (
            error.code ===
            "auth/wrong-password"
        ) {

            message =
                "Incorrect password.";

        }


        showAuthError(message);

    }


    button.disabled = false;
}


/* ============================================
   AUTH STATE
============================================ */

onAuthStateChanged(
    auth,
    function(user) {

        currentUser = user;


        const authCard =
            document.getElementById(
                "authCard"
            );

        const userBar =
            document.getElementById(
                "userBar"
            );

        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (user) {

            authCard.style.display =
                "none";

            userBar.style.display =
                "flex";

            userEmail.textContent =
                user.email;


            startTaskListener();

        } else {

            authCard.style.display =
                "block";

            userBar.style.display =
                "none";

            stopTaskListener();

            renderTasks([]);

        }

    }
);


/* ============================================
   FIRESTORE TASKS
============================================ */

function taskCollection() {

    return collection(
        db,
        "users",
        currentUser.uid,
        "tasks"
    );
}


function startTaskListener() {

    if (!currentUser) {
        return;
    }


    stopTaskListener();


    const tasksQuery =
        query(
            taskCollection(),
            orderBy("createdAt", "asc")
        );


    unsubscribeTasks =
        onSnapshot(
            tasksQuery,
            function(snapshot) {

                const tasks = [];


                snapshot.forEach(
                    function(taskDoc) {

                        tasks.push({
                            id: taskDoc.id,
                            ...taskDoc.data()
                        });

                    }
                );


                renderTasks(tasks);

            },
            function(error) {

                console.error(
                    "Firestore error:",
                    error
                );

                renderTasks([]);

            }
        );
}


function stopTaskListener() {

    if (unsubscribeTasks) {

        unsubscribeTasks();

        unsubscribeTasks = null;

    }
}


/* ============================================
   RENDER TASKS
============================================ */

function renderTasks(tasks) {

    const container =
        document.getElementById(
            "taskList"
        );


    container.innerHTML = "";


    if (!currentUser) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "no-tasks";

        message.textContent =
            "Sign in to save your tasks.";

        container.appendChild(message);

        return;
    }


    if (tasks.length === 0) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "no-tasks";

        message.textContent =
            "No tasks yet. Add one above.";

        container.appendChild(message);

        return;
    }


    tasks.forEach(
        function(task) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "task-row";


            if (task.completed) {

                row.classList.add(
                    "done"
                );

            }


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "task-check";

            checkbox.checked =
                task.completed === true;


            checkbox.addEventListener(
                "change",
                async function() {

                    try {

                        await updateDoc(
                            doc(
                                db,
                                "users",
                                currentUser.uid,
                                "tasks",
                                task.id
                            ),
                            {
                                completed:
                                    checkbox.checked
                            }
                        );

                    } catch (error) {

                        console.error(
                            error
                        );

                    }

                }
            );


            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "task-label";

            label.textContent =
                task.text;


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.type =
                "button";

            deleteButton.className =
                "delete-task";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                async function() {

                    try {

                        await deleteDoc(
                            doc(
                                db,
                                "users",
                                currentUser.uid,
                                "tasks",
                                task.id
                            )
                        );

                    } catch (error) {

                        console.error(
                            error
                        );

                    }

                }
            );


            row.appendChild(
                checkbox
            );

            row.appendChild(
                label
            );

            row.appendChild(
                deleteButton
            );


            container.appendChild(
                row
            );

        }
    );
}


/* ============================================
   ADD TASK
============================================ */

async function addTask() {

    if (!currentUser) {

        showAuthError(
            "Sign in first to save tasks."
        );

        document
            .getElementById("authCard")
            .scrollIntoView({
                behavior: "smooth"
            });

        return;
    }


    const input =
        document.getElementById(
            "taskInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        input.focus();

        return;
    }


    input.disabled = true;


    try {

        await addDoc(
            taskCollection(),
            {
                text: text,
                completed: false,
                createdAt: Date.now()
            }
        );


        input.value = "";

    } catch (error) {

        console.error(error);

        alert(
            "Could not save the task. Check your Firestore setup."
        );

    }


    input.disabled = false;

    input.focus();
}


/* ============================================
   DARK MODE
============================================ */

function loadDarkMode() {

    const dark =
        localStorage.getItem(
            "dailyz_dark"
        ) === "true";


    document.body.classList.toggle(
        "dark",
        dark
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


function toggleDarkMode() {

    const dark =
        !document.body.classList.contains(
            "dark"
        );


    document.body.classList.toggle(
        "dark",
        dark
    );


    localStorage.setItem(
        "dailyz_dark",
        String(dark)
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


/* ============================================
   TABS
============================================ */

document
    .querySelectorAll(".tab")
    .forEach(
        function(tab) {

            tab.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(".tab")
                        .forEach(
                            function(other) {

                                other.classList.remove(
                                    "active"
                                );

                            }
                        );


                    document
                        .querySelectorAll(".section")
                        .forEach(
                            function(section) {

                                section.classList.remove(
                                    "active"
                                );

                            }
                        );


                    tab.classList.add(
                        "active"
                    );


                    document
                        .getElementById(
                            tab.dataset.page
                        )
                        .classList.add(
                            "active"
                        );

                }
            );

        }
    );


/* ============================================
   PRAYER TIMES
============================================ */

const prayerTimes = {

    Fajr: "03:46",

    Dhuhr: "12:20",

    Asr: "16:01",

    Maghrib: "19:04",

    Isha: "20:19"

};


function loadPrayerTimes() {

    const container =
        document.getElementById(
            "prayerList"
        );


    container.innerHTML = "";


    Object.entries(
        prayerTimes
    ).forEach(
        function([name, time]) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "prayer-row";


            const nameElement =
                document.createElement(
                    "span"
                );

            nameElement.textContent =
                name;


            const timeElement =
                document.createElement(
                    "strong"
                );

            timeElement.textContent =
                time;


            row.appendChild(
                nameElement
            );

            row.appendChild(
                timeElement
            );


            container.appendChild(
                row
            );

        }
    );


    updateNextPrayer();

}


function convertTime(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );
}


function updateNextPrayer() {

    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let nextName =
        "Fajr";

    let nextTime =
        prayerTimes.Fajr;


    for (
        const [name, time]
        of Object.entries(prayerTimes)
    ) {

        if (
            convertTime(time) >
            currentMinutes
        ) {

            nextName =
                name;

            nextTime =
                time;

            break;

        }

    }


    document.getElementById(
        "nextName"
    ).textContent =
        nextName;


    document.getElementById(
        "nextTime"
    ).textContent =
        nextTime;
}

/* ============================================
   NOTIFICATIONS
============================================ */

document
    .getElementById(
        "notificationButton"
    )
    .addEventListener(
        "click",
        async function() {

            const status =
                document.getElementById(
                    "notificationStatus"
                );


            if (
                !("Notification" in window)
            ) {

                status.textContent =
                    "Notifications are not supported.";

                return;

            }


            try {

                const permission =
                    await Notification.requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    status.textContent =
                        "Notifications are enabled.";

                } else {

                    status.textContent =
                        "Notifications are disabled.";

                }

            } catch {

                status.textContent =
                    "Could not enable notifications.";

            }

        }
    );
