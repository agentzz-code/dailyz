<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dailyz</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f5f5f7;
        color: #111;
        transition: background .25s ease, color .25s ease;
    }

    button,
    input {
        font-family: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 50px;
    }

    /* HEADER */

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
    }

    .logo {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -1px;
    }

    .date {
        margin-top: 5px;
        color: #777;
        font-size: 14px;
    }

    .icon-button {
        width: 45px;
        height: 45px;
        border: 0;
        border-radius: 50%;
        background: #e7e7e9;
        color: #111;
        font-size: 21px;
        line-height: 45px;
        padding: 0;
    }

    body.dark {
        background: #111214;
        color: #f5f5f5;
    }

    body.dark .date {
        color: #999;
    }

    body.dark .icon-button {
        background: #292a2f;
        color: #fff;
    }

    /* TABS */

    .tabs {
        display: flex;
        gap: 6px;
        padding: 5px;
        margin-bottom: 22px;
        border-radius: 13px;
        background: #e6e6e8;
    }

    .tab {
        flex: 1;
        border: 0;
        border-radius: 9px;
        padding: 12px;
        background: transparent;
        color: #666;
        font-size: 15px;
        font-weight: 600;
    }

    .tab.active {
        background: #fff;
        color: #111;
        box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    body.dark .tabs {
        background: #242529;
    }

    body.dark .tab {
        color: #aaa;
    }

    body.dark .tab.active {
        background: #383a40;
        color: #fff;
    }

    /* SECTIONS */

    .section {
        display: none;
    }

    .section.active {
        display: block;
    }

    /* TASK INPUT */

    .task-input {
        display: flex;
        gap: 9px;
        margin-bottom: 18px;
    }

    .task-input input {
        flex: 1;
        min-width: 0;
        height: 52px;
        padding: 0 15px;
        border: 1px solid #ddd;
        border-radius: 12px;
        outline: none;
        background: #fff;
        color: #111;
        font-size: 16px;
    }

    .task-input input:focus {
        border-color: #999;
    }

    body.dark .task-input input {
        background: #1d1f23;
        border-color: #393b40;
        color: #fff;
    }

    .add-button {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        border: 0;
        border-radius: 12px;
        background: #111;
        color: #fff;
        font-size: 28px;
        line-height: 52px;
        padding: 0;
    }

    .add-button:active {
        transform: scale(.95);
    }

    /* TASK LIST */

    .task-list {
        width: 100%;
    }

    .task {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 52px;
        gap: 12px;
        margin-bottom: 9px;
        padding: 15px;
        border-radius: 13px;
        background: #fff;
        box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }

    body.dark .task {
        background: #1d1f23;
    }

    .task-checkbox {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        margin: 0;
    }

    .task-text {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
    }

    .task.completed .task-text {
        text-decoration: line-through;
        opacity: .45;
    }

    .delete-button {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 16px;
        opacity: .65;
    }

    .empty {
        padding: 35px 10px;
        text-align: center;
        color: #888;
    }

    /* PRAYER */

    .prayer-header {
        margin-bottom: 18px;
    }

    .prayer-header h2 {
        margin: 0 0 5px;
    }

    .location {
        color: #777;
        font-size: 14px;
    }

    .next-prayer {
        margin-bottom: 18px;
        padding: 23px;
        border-radius: 18px;
        background: #111;
        color: #fff;
    }

    body.dark .next-prayer {
        background: #292b30;
    }

    .next-label {
        font-size: 11px;
        letter-spacing: 1px;
        opacity: .6;
    }

    .next-name {
        margin-top: 5px;
        font-size: 28px;
        font-weight: 700;
    }

    .next-time {
        margin-top: 2px;
        font-size: 38px;
        font-weight: 700;
    }

    .prayer-list {
        width: 100%;
    }

    .prayer-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 52px;
        margin-bottom: 8px;
        padding: 15px 16px;
        border-radius: 12px;
        background: #fff;
    }

    body.dark .prayer-item {
        background: #1d1f23;
    }

    /* SETTINGS */

    .settings-card {
        margin-top: 20px;
        padding: 19px;
        border-radius: 16px;
        background: #fff;
    }

    body.dark .settings-card {
        background: #1d1f23;
    }

    .settings-title {
        margin-bottom: 13px;
        font-weight: 700;
    }

    .location-row {
        display: flex;
        gap: 8px;
    }

    .location-row input {
        flex: 1;
        min-width: 0;
        height: 45px;
        padding: 0 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: #111;
    }

    body.dark .location-row input {
        background: #292b30;
        border-color: #3a3c42;
        color: #fff;
    }

    .small-button {
        height: 45px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: #111;
        color: #fff;
        font-weight: 600;
    }

    .notification-button {
        width: 100%;
        height: 45px;
        margin-top: 11px;
        border: 0;
        border-radius: 10px;
        background: #111;
        color: #fff;
        font-weight: 600;
    }

    .status {
        margin-top: 9px;
        color: #777;
        font-size: 13px;
    }
</style>

</head>

<body>

<div class="app">

</div>

<script>

/* ================================
   DATE
================================ */

function updateDate() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        });
}


/* ================================
   TASKS
================================ */

let tasks = [];


function loadTasks() {

    try {

        const saved =
            localStorage.getItem("dailyz_tasks");

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {
                tasks = parsed;
            }

        }

    } catch (error) {

        tasks = [];

    }
}


function saveTasks() {

    try {

        localStorage.setItem(
            "dailyz_tasks",
            JSON.stringify(tasks)
        );

    } catch (error) {

        console.error(error);

    }
}


function renderTasks() {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    if (tasks.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No tasks yet. Add one above.";

        list.appendChild(empty);

        return;
    }


    tasks.forEach(function(task, index) {

        const row =
            document.createElement("div");

        row.className = "task";


        if (task.completed) {
            row.classList.add("completed");
        }


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className =
            "task-checkbox";

        checkbox.checked =
            Boolean(task.completed);


        checkbox.addEventListener(
            "change",
            function() {

                tasks[index].completed =
                    checkbox.checked;

                saveTasks();

                renderTasks();

            }
        );


        const text =
            document.createElement("div");

        text.className =
            "task-text";

        text.textContent =
            task.text;


        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent = "🗑️";


        deleteButton.addEventListener(
            "click",
            function() {

                tasks.splice(index, 1);

                saveTasks();

                renderTasks();

            }
        );


        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(deleteButton);

        list.appendChild(row);

    });
}


function addTask() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if (text.length === 0) {

        input.focus();

        return;
    }


    tasks.push({
        text: text,
        completed: false
    });


    saveTasks();

    renderTasks();

    input.value = "";

    input.focus();
}


/* ================================
   TABS
================================ */

const tabs =
    document.querySelectorAll(".tab");


tabs.forEach(function(tab) {

    tab.addEventListener(
        "click",
        function() {

            tabs.forEach(function(t) {
                t.classList.remove("active");
            });


            document
                .querySelectorAll(".section")
                .forEach(function(section) {
                    section.classList.remove("active");
                });


            tab.classList.add("active");


            document
                .getElementById(tab.dataset.tab)
                .classList.add("active");

        }
    );

});


/* ================================
   DARK MODE
================================ */

function loadTheme() {

    const dark =
        localStorage.getItem(
            "dailyz_dark"
        ) === "true";


    document.body.classList.toggle(
        "dark",
        dark
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


function toggleTheme() {

    const dark =
        !document.body.classList.contains("dark");


    document.body.classList.toggle(
        "dark",
        dark
    );


    localStorage.setItem(
        "dailyz_dark",
        String(dark)
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


/* ================================
   ERBIL PRAYER DATA
================================ */

/*
   Verified from the times you provided
   from Katakani Bang for August 10, 2026.

   We do NOT invent other dates.
*/

const prayerData = {

    "2026-08-10": {
        Fajr: "03:46",
        Dhuhr: "12:20",
        Asr: "16:01",
        Maghrib: "19:04",
        Isha: "20:19"
    }

};


function getDateKey() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


function loadPrayerTimes() {

    const key =
        getDateKey();


    const data =
        prayerData[key];


    const list =
        document.getElementById(
            "prayerList"
        );


    list.innerHTML = "";


    if (!data) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "Prayer times are not available for this date yet.";

        list.appendChild(empty);


        document.getElementById(
            "nextName"
        ).textContent =
            "Unavailable";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";

        return;
    }


    const prayers = [
        ["Fajr", data.Fajr],
        ["Dhuhr", data.Dhuhr],
        ["Asr", data.Asr],
        ["Maghrib", data.Maghrib],
        ["Isha", data.Isha]
    ];


    prayers.forEach(function(prayer) {

        const item =
            document.createElement("div");

        item.className =
            "prayer-item";


        const name =
            document.createElement("span");

        name.textContent =
            prayer[0];


        const time =
            document.createElement("strong");

        time.textContent =
            prayer[1];


        item.appendChild(name);
        item.appendChild(time);

        list.appendChild(item);

    });


    updateNextPrayer(prayers);
}


function updateNextPrayer(prayers) {

    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let next = null;


    for (
        let i = 0;
        i < prayers.length;
        i++
    ) {

        const parts =
            prayers[i][1].split(":");


        const minutes =
            Number(parts[0]) * 60 +
            Number(parts[1]);


        if (minutes > currentMinutes) {

            next = prayers[i];

            break;
        }
    }


    if (!next) {
        next = prayers[0];
    }


    document.getElementById(
        "nextName"
    ).textContent =
        next[0];


    document.getElementById(
        "nextTime"
    ).textContent =
        next[1];
}


/* ================================
   NOTIFICATIONS
================================ */

async function enableNotifications() {

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if (!("Notification" in window)) {

        status.textContent =
            "Notifications are not supported.";

        return;
    }


    try {

        const permission =
            await Notification.requestPermission();


        if (permission === "granted") {

            status.textContent =
                "Notifications are enabled.";

        } else {

            status.textContent =
                "Notifications are disabled.";

        }

    } catch (error) {

        status.textContent =
            "Could not enable notifications.";

    }
}


/* ================================
   EVENT LISTENERS
================================ */

document
    .getElementById("addTaskButton")
    .addEventListener(
        "click",
        addTask
    );


document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                addTask();

            }

        }
    );


document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        toggleTheme
    );


document
    .getElementById("updateLocationButton")
    .addEventListener(
        "click",
        function() {

            const value =
                document
                    .getElementById("locationInput")
                    .value
                    .trim();


            document.getElementById(
                "locationText"
            ).textContent =
                value || "Erbil, Iraq";


            loadPrayerTimes();

        }
    );


document
    .getElementById("notificationButton")
    .addEventListener(
        "click",
        enableNotifications
    );


/* ================================
   START
================================ */

updateDate();

loadTheme();

loadTasks();

renderTasks();

loadPrayerTimes();

</script>

</body>
</html>
