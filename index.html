<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dailyz</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
    transition: background .25s, color .25s;
}

/* Prevent accidental bullets/dots */
ul,
ol,
li {
    list-style: none !important;
    margin: 0;
    padding: 0;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(720px, 100%);
    margin: auto;
    padding: 24px 18px 50px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
}

.date {
    margin-top: 5px;
    color: #777;
    font-size: 14px;
}

.icon-button {
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: #e6e6e8;
    font-size: 21px;
}

body.dark {
    background: #111214;
    color: #f5f5f5;
}

body.dark .icon-button {
    background: #292a2f;
    color: white;
}

/* TABS */

.tabs {
    display: flex;
    gap: 6px;
    padding: 5px;
    margin-bottom: 22px;
    border-radius: 13px;
    background: #e6e6e8;
}

.tab {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #666;
    font-weight: 600;
}

.tab.active {
    background: white;
    color: #111;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

body.dark .tabs {
    background: #242529;
}

body.dark .tab {
    color: #aaa;
}

body.dark .tab.active {
    background: #383a40;
    color: white;
}

/* SECTIONS */

.section {
    display: none;
}

.section.active {
    display: block;
}

/* TASK INPUT */

.task-input {
    display: flex;
    gap: 9px;
    margin-bottom: 18px;
}

.task-input input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    background: white;
    color: #111;
    font-size: 16px;
}

body.dark .task-input input {
    background: #1d1f23;
    color: white;
    border-color: #393b40;
}

.add-button {
    width: 52px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 27px;
}

.add-button:active {
    transform: scale(.95);
}

/* TASKS */

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 9px;
    padding: 15px;
    border-radius: 13px;
    background: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

body.dark .task {
    background: #1d1f23;
}

.task-checkbox {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
}

.task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.task.completed .task-text {
    text-decoration: line-through;
    opacity: .45;
}

.delete-button {
    padding: 5px;
    border: 0;
    background: transparent;
    font-size: 17px;
    opacity: .6;
}

.empty {
    padding: 35px 10px;
    text-align: center;
    color: #888;
}

/* PRAYERS */

.prayer-header {
    margin-bottom: 18px;
}

.prayer-header h2 {
    margin: 0 0 5px;
}

.location {
    color: #777;
    font-size: 14px;
}

.next-prayer {
    margin-bottom: 18px;
    padding: 23px;
    border-radius: 18px;
    background: #111;
    color: white;
}

body.dark .next-prayer {
    background: #292b30;
}

.next-label {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: .6;
}

.next-name {
    margin-top: 5px;
    font-size: 28px;
    font-weight: 700;
}

.next-time {
    margin-top: 2px;
    font-size: 38px;
    font-weight: 700;
}

.prayer-item {
    display: flex;
    justify-content: space-between;
    padding: 15px 16px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: white;
}

body.dark .prayer-item {
    background: #1d1f23;
}

/* SETTINGS */

.settings-card {
    margin-top: 20px;
    padding: 19px;
    border-radius: 16px;
    background: white;
}

body.dark .settings-card {
    background: #1d1f23;
}

.settings-title {
    margin-bottom: 13px;
    font-weight: 700;
}

.location-row {
    display: flex;
    gap: 8px;
}

.location-row input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
}

.small-button,
.notification-button {
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-weight: 600;
}

.small-button {
    padding: 12px 16px;
}

.notification-button {
    width: 100%;
    margin-top: 11px;
    padding: 13px;
}

.status {
    margin-top: 9px;
    color: #777;
    font-size: 13px;
}
</style>

</head>

<body>

<div class="app">

<header class="header">
    <div>
        <div class="logo">Dailyz</div>
        <div class="date" id="date"></div>
    </div>

```
<button
    class="icon-button"
    id="themeButton"
    type="button"
>☾</button>
```

</header>

<div class="tabs">

```
<button
    class="tab active"
    data-tab="tasks"
    type="button"
>
    Tasks
</button>

<button
    class="tab"
    data-tab="prayers"
    type="button"
>
    Prayer Times
</button>
```

</div>

<!-- TASKS -->

<section
    class="section active"
    id="tasks"
>

```
<div class="task-input">

    <input
        id="taskInput"
        type="text"
        placeholder="Add a task..."
        autocomplete="off"
    >

    <button
        class="add-button"
        id="addTaskButton"
        type="button"
    >+</button>

</div>

<div
    class="task-list"
    id="taskList"
></div>
```

</section>

<!-- PRAYERS -->

<section
    class="section"
    id="prayers"
>

```
<div class="prayer-header">

    <h2>Prayer Times</h2>

    <div
        class="location"
        id="locationText"
    >
        Erbil, Iraq
    </div>

</div>


<div class="next-prayer">

    <div class="next-label">
        NEXT PRAYER
    </div>

    <div
        class="next-name"
        id="nextName"
    >
        Loading...
    </div>

    <div
        class="next-time"
        id="nextTime"
    >
        --:--
    </div>

</div>


<div
    class="prayer-list"
    id="prayerList"
></div>


<div class="settings-card">

    <div class="settings-title">
        Prayer settings
    </div>

    <div class="location-row">

        <input
            id="locationInput"
            type="text"
            value="Erbil, Iraq"
            placeholder="City, Country"
        >

        <button
            class="small-button"
            id="updateLocationButton"
            type="button"
        >
            Update
        </button>

    </div>


    <button
        class="notification-button"
        id="notificationButton"
        type="button"
    >
        🔔 Enable Prayer Notifications
    </button>

    <div
        class="status"
        id="notificationStatus"
    >
        Notifications are disabled.
    </div>

</div>
```

</section>

</div>

<script>

/* ==========================================
   DATE
========================================== */

function updateDate() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        });
}


/* ==========================================
   TASKS
========================================== */

let tasks = [];

function loadTasks() {

    try {

        const saved =
            localStorage.getItem("dailyz_tasks");

        if (saved) {

            const data =
                JSON.parse(saved);

            if (Array.isArray(data)) {
                tasks = data;
            }

        }

    } catch {

        tasks = [];

    }
}


function saveTasks() {

    localStorage.setItem(
        "dailyz_tasks",
        JSON.stringify(tasks)
    );
}


function renderTasks() {

    const list =
        document.getElementById("taskList");

    list.replaceChildren();


    if (tasks.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No tasks yet. Add one above.";

        list.appendChild(empty);

        return;
    }


    tasks.forEach(function(task, index) {

        const item =
            document.createElement("div");

        item.className = "task";


        if (task.completed) {
            item.classList.add("completed");
        }


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className =
            "task-checkbox";

        checkbox.checked =
            task.completed;


        checkbox.addEventListener(
            "change",
            function() {

                tasks[index].completed =
                    checkbox.checked;

                saveTasks();

                renderTasks();

            }
        );


        const text =
            document.createElement("div");

        text.className =
            "task-text";

        text.textContent =
            task.text;


        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "🗑️";


        deleteButton.addEventListener(
            "click",
            function() {

                tasks.splice(index, 1);

                saveTasks();

                renderTasks();

            }
        );


        item.appendChild(checkbox);

        item.appendChild(text);

        item.appendChild(deleteButton);

        list.appendChild(item);

    });
}


function addTask() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if (!text) {

        input.focus();

        return;
    }


    tasks.push({
        text: text,
        completed: false
    });


    saveTasks();

    renderTasks();

    input.value = "";

    input.focus();
}


/* ==========================================
   TABS
========================================== */

document
    .querySelectorAll(".tab")
    .forEach(function(tab) {

        tab.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".tab")
                    .forEach(function(t) {
                        t.classList.remove("active");
                    });


                document
                    .querySelectorAll(".section")
                    .forEach(function(section) {
                        section.classList.remove("active");
                    });


                tab.classList.add("active");


                document
                    .getElementById(tab.dataset.tab)
                    .classList.add("active");

            }
        );

    });


/* ==========================================
   DARK MODE
========================================== */

function loadTheme() {

    const dark =
        localStorage.getItem(
            "dailyz_dark"
        ) === "true";


    document.body.classList.toggle(
        "dark",
        dark
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


function toggleDarkMode() {

    const dark =
        !document.body.classList.contains(
            "dark"
        );


    document.body.classList.toggle(
        "dark",
        dark
    );


    localStorage.setItem(
        "dailyz_dark",
        String(dark)
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


/* ==========================================
   ERBIL PRAYER TIMES
========================================== */

/*
   These are the verified times you gave me
   from Katakani Bang for August 10, 2026.

   We keep them as the verified baseline instead
   of pretending another calculation method is
   identical to Katakani Bang.
*/

const prayerData = {

    "2026-08-10": {
        Fajr: "03:46",
        Dhuhr: "12:20",
        Asr: "16:01",
        Maghrib: "19:04",
        Isha: "20:19"
    }

};


function getTodayKey() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


function loadPrayerTimes() {

    const key =
        getTodayKey();


    const data =
        prayerData[key];


    const list =
        document.getElementById(
            "prayerList"
        );


    list.replaceChildren();


    if (!data) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "Prayer timetable for today has not been added yet.";

        list.appendChild(empty);


        document.getElementById(
            "nextName"
        ).textContent =
            "Unavailable";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";

        return;
    }


    const prayers = [
        ["Fajr", data.Fajr],
        ["Dhuhr", data.Dhuhr],
        ["Asr", data.Asr],
        ["Maghrib", data.Maghrib],
        ["Isha", data.Isha]
    ];


    prayers.forEach(function(prayer) {

        const item =
            document.createElement("div");

        item.className =
            "prayer-item";


        const name =
            document.createElement("span");

        name.textContent =
            prayer[0];


        const time =
            document.createElement("strong");

        time.textContent =
            prayer[1];


        item.appendChild(name);

        item.appendChild(time);

        list.appendChild(item);

    });


    updateNextPrayer(prayers);
}


function updateNextPrayer(prayers) {

    const now =
        new Date();


    const current =
        now.getHours() * 60 +
        now.getMinutes();


    let next = null;


    for (const prayer of prayers) {

        const parts =
            prayer[1].split(":");


        const minutes =
            Number(parts[0]) * 60 +
            Number(parts[1]);


        if (minutes > current) {

            next = prayer;

            break;
        }
    }


    if (!next) {

        next = prayers[0];

    }


    document.getElementById(
        "nextName"
    ).textContent =
        next[0];


    document.getElementById(
        "nextTime"
    ).textContent =
        next[1];
}


/* ==========================================
   NOTIFICATIONS
========================================== */

async function enableNotifications() {

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if (!("Notification" in window)) {

        status.textContent =
            "Notifications are not supported here.";

        return;
    }


    const permission =
        await Notification.requestPermission();


    if (permission === "granted") {

        status.textContent =
            "Notifications are enabled.";

    } else {

        status.textContent =
            "Notifications are disabled.";
    }
}


/* ==========================================
   BUTTONS
========================================== */

document
    .getElementById("addTaskButton")
    .addEventListener(
        "click",
        addTask
    );


document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                addTask();

            }

        }
    );


document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        toggleDarkMode
    );


document
    .getElementById("updateLocationButton")
    .addEventListener(
        "click",
        function() {

            /*
                Currently the verified timetable
                is specifically for Erbil.
            */

            document.getElementById(
                "locationText"
            ).textContent =
                document.getElementById(
                    "locationInput"
                ).value.trim() ||
                "Erbil, Iraq";

            loadPrayerTimes();

        }
    );


document
    .getElementById("notificationButton")
    .addEventListener(
        "click",
        enableNotifications
    );


/* ==========================================
   START
========================================== */

updateDate();

loadTheme();

loadTasks();

renderTasks();

loadPrayerTimes();

</script>

</body>
</html>
