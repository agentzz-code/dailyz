<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dailyz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
}

button,
input {
    font: inherit;
}

.app {
    width: min(700px, calc(100% - 30px));
    margin: auto;
    padding: 25px 0 50px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
}

.date {
    margin-top: 5px;
    color: #777;
    font-size: 14px;
}

.icon-button {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #e5e5e7;
    cursor: pointer;
    font-size: 20px;
}

/* AUTH */

.auth-card {
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 18px;
    background: white;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.auth-card h2 {
    margin: 0;
    font-size: 25px;
}

.auth-subtitle {
    margin: 7px 0 20px;
    color: #777;
}

.auth-input {
    width: 100%;
    height: 50px;
    margin-bottom: 11px;
    padding: 0 14px;
    border: 1px solid #ddd;
    border-radius: 11px;
    outline: none;
}

.auth-input:focus {
    border-color: #111;
}

.password-box {
    position: relative;
}

.password-box .auth-input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 5px;
    top: 5px;
    height: 40px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #666;
    cursor: pointer;
}

.auth-button {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 11px;
    background: #111;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.auth-button:disabled {
    opacity: .5;
}

.auth-switch {
    margin-top: 15px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

.auth-switch button {
    border: 0;
    background: transparent;
    font-weight: 700;
    cursor: pointer;
}

.auth-error {
    display: none;
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 9px;
    background: #ffecec;
    color: #c00;
    font-size: 13px;
}

/* USER */

.user-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 13px 15px;
    margin-bottom: 18px;
    border-radius: 13px;
    background: white;
}

.username {
    font-weight: 700;
}

.email {
    margin-top: 3px;
    color: #777;
    font-size: 12px;
}

.logout {
    border: 0;
    border-radius: 9px;
    padding: 9px 13px;
    background: #eee;
    cursor: pointer;
}

/* TABS */

.tabs {
    display: flex;
    gap: 5px;
    padding: 5px;
    margin-bottom: 20px;
    border-radius: 13px;
    background: #e5e5e7;
}

.tab {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #666;
    cursor: pointer;
}

.tab.active {
    background: white;
    color: #111;
}

/* SECTIONS */

.section {
    display: none;
}

.section.active {
    display: block;
}

/* TASKS */

.task-input {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

#taskInput {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    background: white;
}

.add-button {
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 27px;
    cursor: pointer;
}

.task {
    display: flex;
    align-items: center;
    min-height: 54px;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: white;
}

.task input {
    width: 19px;
    height: 19px;
    margin-right: 12px;
}

.task-text {
    flex: 1;
    overflow-wrap: anywhere;
}

.task.completed .task-text {
    text-decoration: line-through;
    opacity: .45;
}

.delete-task {
    border: 0;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #888;
}

/* PRAYERS */

.prayer-header h2 {
    margin-bottom: 5px;
}

.location {
    color: #777;
    font-size: 14px;
}

.next-prayer {
    padding: 22px;
    margin: 18px 0;
    border-radius: 18px;
    background: #111;
    color: white;
}

.next-label {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: .6;
}

.next-name {
    margin-top: 5px;
    font-size: 27px;
    font-weight: 700;
}

.next-time {
    margin-top: 2px;
    font-size: 38px;
    font-weight: 700;
}

.prayer {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: white;
}

.settings {
    margin-top: 18px;
    padding: 18px;
    border-radius: 16px;
    background: white;
}

.settings-title {
    margin-bottom: 12px;
    font-weight: 700;
}

.location-row {
    display: flex;
    gap: 8px;
}

#locationInput {
    flex: 1;
    min-width: 0;
    height: 45px;
    padding: 0 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.small-button,
.notification-button {
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    cursor: pointer;
}

.small-button {
    padding: 0 15px;
}

.notification-button {
    width: 100%;
    height: 45px;
    margin-top: 10px;
}

.status {
    margin-top: 8px;
    color: #777;
    font-size: 13px;
}

/* DARK */

body.dark {
    background: #111214;
    color: white;
}

body.dark .auth-card,
body.dark .user-bar,
body.dark .task,
body.dark .prayer,
body.dark .settings {
    background: #1d1f23;
}

body.dark .auth-input,
body.dark #taskInput,
body.dark #locationInput {
    background: #292b30;
    color: white;
    border-color: #444;
}

body.dark .tabs {
    background: #242529;
}

body.dark .tab {
    color: #aaa;
}

body.dark .tab.active {
    background: #383a40;
    color: white;
}

body.dark .logout {
    background: #383a40;
    color: white;
}
</style>

</head>

<body>

<div class="app">

<header class="header">
    <div>
        <div class="logo">Dailyz</div>
        <div class="date" id="date"></div>
    </div>

```
<button class="icon-button" id="themeButton" type="button">☾</button>
```

</header>

<!-- AUTH -->

<div class="auth-card" id="authCard">

```
<h2 id="authTitle">Create your account</h2>

<div class="auth-subtitle" id="authSubtitle">
    Start organizing your day with Dailyz.
</div>

<div class="auth-error" id="authError"></div>

<input
    class="auth-input"
    id="usernameInput"
    type="text"
    placeholder="Username"
    autocomplete="username"
>

<input
    class="auth-input"
    id="emailInput"

>

    <input
        class="auth-input"

    </button>

</div>
```

</div>

<div>
    <div class="username" id="usernameDisplay"></div>

</div>

<button class="logout" id="logoutButton" type="button">
    Log Out
</button>

</section>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    onSnapshot,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyBZs-JcWpgc9LHbhMJT9l5AdTBvYOEFMZ8",
    authDomain: "dailyz-web.firebaseapp.com",
    projectId: "dailyz-web",
    storageBucket: "dailyz-web.firebasestorage.app",
    messagingSenderId: "1031947329415",
    appId: "1:1031947329415:web:475f3f0d7449992fc73d22"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let unsubscribeTasks = null;
let signUpMode = true;


/* DATE */

document.getElementById("date").textContent =
    new Date().toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    });


/* AUTH MODE */

function setAuthMode() {

    document.getElementById("authTitle").textContent =
        signUpMode
        ? "Create your account"
        : "Welcome back";

    document.getElementById("authSubtitle").textContent =
        signUpMode
        ? "Start organizing your day with Dailyz."
        : "Sign in to continue using Dailyz.";

    document.getElementById("usernameInput").style.display =
        signUpMode ? "block" : "none";

    document.getElementById("confirmBox").style.display =
        signUpMode ? "block" : "none";

    document.getElementById("authButton").textContent =
        signUpMode ? "Create Account" : "Sign In";

    document.getElementById("switchText").textContent =
        signUpMode
        ? "Already have an account?"
        : "Don't have an account?";

    document.getElementById("switchButton").textContent =
        signUpMode ? "Sign In" : "Sign Up";

    clearError();
}


function showError(message) {

    const error = document.getElementById("authError");

    error.textContent = message;
    error.style.display = "block";
}


function clearError() {

    const error = document.getElementById("authError");

    error.textContent = "";
    error.style.display = "none";
}


/* SIGN UP */

async function createAccount() {

    clearError();

    const username =
        document.getElementById("usernameInput").value.trim();

    const email =
        document.getElementById("emailInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const confirm =
        document.getElementById("confirmPasswordInput").value;


    if (username.length < 2) {
        showError("Username must be at least 2 characters.");
        return;
    }

    if (!email) {
        showError("Enter your email.");
        return;
    }

    if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
    }

    if (password !== confirm) {
        showError("Passwords do not match.");
        return;
    }


    const button =
        document.getElementById("authButton");

    button.disabled = true;


    try {

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await setDoc(
            doc(db, "users", result.user.uid),
            {
                username: username,
                email: email,
                createdAt: Date.now()
            }
        );


    } catch (error) {

        if (error.code === "auth/email-already-in-use") {
            showError("That email is already registered.");
        }
        else if (error.code === "auth/invalid-email") {
            showError("Enter a valid email.");
        }
        else if (error.code === "auth/weak-password") {
            showError("Password is too weak.");
        }
        else {
            showError(error.message);
        }

    }


    button.disabled = false;
}


/* SIGN IN */

async function login() {

    clearError();

    const email =
        document.getElementById("emailInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;


    if (!email || !password) {
        showError("Enter your email and password.");
        return;
    }


    const button =
        document.getElementById("authButton");

    button.disabled = true;


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        if (error.code === "auth/invalid-credential") {
            showError("Incorrect email or password.");
        }
        else {
            showError(error.message);
        }

    }


    button.disabled = false;
}


/* AUTH BUTTON */

document
    .getElementById("authButton")
    .addEventListener("click", () => {

        if (signUpMode) {
            createAccount();
        } else {
            login();
        }

    });


/* SWITCH */

document
    .getElementById("switchButton")
    .addEventListener("click", () => {

        signUpMode = !signUpMode;

        setAuthMode();

    });


/* PASSWORD */

document
    .getElementById("showPassword")
    .addEventListener("click", () => {

        const input =
            document.getElementById("passwordInput");

        if (input.type === "password") {

            input.type = "text";

            document.getElementById("showPassword")
                .textContent = "Hide";

        } else {

            input.type = "password";

            document.getElementById("showPassword")
                .textContent = "Show";
        }

    });


/* AUTH STATE */

onAuthStateChanged(auth, async user => {

    currentUser = user;

    const authCard =
        document.getElementById("authCard");

    const userBar =
        document.getElementById("userBar");


    if (user) {

        authCard.style.display = "none";
        userBar.style.display = "flex";

        document.getElementById("emailDisplay")
            .textContent = user.email;


        const profile =
            await getDoc(
                doc(db, "users", user.uid)
            );


        if (profile.exists()) {

            document.getElementById("usernameDisplay")
                .textContent =
                profile.data().username;

        } else {

            document.getElementById("usernameDisplay")
                .textContent = "User";
        }


        startTaskListener();

    } else {

        authCard.style.display = "block";
        userBar.style.display = "none";

        stopTaskListener();

        renderTasks([]);

    }

});


/* LOG OUT */

document
    .getElementById("logoutButton")
    .addEventListener("click", () => {

        signOut(auth);

    });


/* TASKS */

function taskCollection() {

    return collection(
        db,
        "users",
        currentUser.uid,
        "tasks"
    );
}


function startTaskListener() {

    stopTaskListener();

    if (!currentUser) return;


    const taskQuery =
        query(
            taskCollection(),
            orderBy("createdAt", "asc")
        );


    unsubscribeTasks =
        onSnapshot(taskQuery, snapshot => {

            const tasks = [];

            snapshot.forEach(item => {

                tasks.push({
                    id: item.id,
                    ...item.data()
                });

            });

            renderTasks(tasks);

        });
}


function stopTaskListener() {

    if (unsubscribeTasks) {

        unsubscribeTasks();

        unsubscribeTasks = null;
    }
}


function renderTasks(tasks) {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    if (!currentUser) {

        const empty =
            document.createElement("div");

        empty.className = "empty";
        empty.textContent =
            "Sign in to save your tasks.";

        list.appendChild(empty);

        return;
    }


    if (tasks.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";
        empty.textContent =
            "No tasks yet. Add one above.";

        list.appendChild(empty);

        return;
    }


    tasks.forEach(task => {

        const row =
            document.createElement("div");

        row.className = "task";


        if (task.completed) {
            row.classList.add("completed");
        }


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = !!task.completed;


        checkbox.addEventListener("change", async () => {

            await updateDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "tasks",
                    task.id
                ),
                {
                    completed: checkbox.checked
                }
            );

        });


        const text =
            document.createElement("div");

        text.className = "task-text";
        text.textContent = task.text;


        const remove =
            document.createElement("button");

        remove.className = "delete-task";
        remove.type = "button";
        remove.textContent = "×";


        remove.addEventListener("click", async () => {

            await deleteDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "tasks",
                    task.id
                )
            );

        });


        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(remove);

        list.appendChild(row);

    });

}


/* ADD TASK */

async function addTask() {

    if (!currentUser) {
        return;
    }


    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if (!text) return;


    await addDoc(
        taskCollection(),
        {
            text: text,
            completed: false,
            createdAt: Date.now()
        }
    );


    input.value = "";

    input.focus();
}


document
    .getElementById("addTaskButton")
    .addEventListener("click", addTask);


document
    .getElementById("taskInput")
    .addEventListener("keydown", event => {

        if (event.key === "Enter") {

            event.preventDefault();

            addTask();

        }

    });


/* TABS */

document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener("click", () => {

            document
                .querySelectorAll(".tab")
                .forEach(item =>
                    item.classList.remove("active")
                );


            document
                .querySelectorAll(".section")
                .forEach(section =>
                    section.classList.remove("active")
                );


            tab.classList.add("active");

            document
                .getElementById(tab.dataset.tab)
                .classList.add("active");

        });

    });


/* DARK MODE */

function updateTheme() {

    const dark =
        localStorage.getItem("dailyz_dark") === "true";

    document.body.classList.toggle("dark", dark);

    document.getElementById("themeButton")
        .textContent = dark ? "☀" : "☾";
}


document
    .getElementById("themeButton")
    .addEventListener("click", () => {

        const dark =
            !document.body.classList.contains("dark");

        document.body.classList.toggle("dark", dark);

        localStorage.setItem(
            "dailyz_dark",
            dark
        );

        document.getElementById("themeButton")
            .textContent = dark ? "☀" : "☾";

    });


/* PRAYER TIMES */

const prayers = {
    Fajr: "03:46",
    Dhuhr: "12:20",
    Asr: "16:01",
    Maghrib: "19:04",
    Isha: "20:19"
};


function loadPrayers() {

    const list =
        document.getElementById("prayerList");

    list.innerHTML = "";


    Object.entries(prayers).forEach(
        ([name, time]) => {

            const row =
                document.createElement("div");

            row.className = "prayer";

            row.innerHTML =
                `<span>${name}</span><strong>${time}</strong>`;

            list.appendChild(row);

        }
    );


    updateNextPrayer();
}


function updateNextPrayer() {

    const now = new Date();

    const current =
        now.getHours() * 60 +
        now.getMinutes();


    let next = null;


    for (const [name, time] of Object.entries(prayers)) {

        const [hours, minutes] =
            time.split(":").map(Number);

        const value =
            hours * 60 + minutes;


        if (value > current) {

            next = [name, time];

            break;
        }

    }


    if (!next) {
        next = ["Fajr", prayers.Fajr];
    }


    document.getElementById("nextName")
        .textContent = next[0];

    document.getElementById("nextTime")
        .textContent = next[1];

}


document
    .getElementById("updateLocationButton")
    .addEventListener("click", () => {

        const value =
            document.getElementById("locationInput")
                .value.trim();

        document.getElementById("locationText")
            .textContent = value || "Erbil, Iraq";

    });


/* NOTIFICATIONS */

document
    .getElementById("notificationButton")
    .addEventListener("click", async () => {

        const status =
            document.getElementById("notificationStatus");


        if (!("Notification" in window)) {

            status.textContent =
                "Notifications are not supported.";

            return;
        }


        const permission =
            await Notification.requestPermission();


        status.textContent =
            permission === "granted"
            ? "Notifications are enabled."
            : "Notifications are disabled.";

    });


/* START */

setAuthMode();
updateTheme();
loadPrayers();

</script>

</body>
</html>
