<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dailyz">

<title>Dailyz</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", Arial, sans-serif;
}

body {
    background: #f5f5f7;
    color: #111;
    padding:
        env(safe-area-inset-top)
        18px
        env(safe-area-inset-bottom)
        18px;
    transition: background .2s, color .2s;
    overflow-x: hidden;
}

body.dark {
    background: #111;
    color: #fff;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.date {
    margin-top: 3px;
    color: #777;
    font-size: 13px;
}

.dark .date {
    color: #999;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 14px;
    background: #e9e9ed;
    font-size: 20px;
}

.dark .icon-button {
    background: #242424;
    color: white;
}

.tabs {
    max-width: 700px;
    margin: 10px auto 18px;
    display: flex;
    background: #e6e6eb;
    padding: 4px;
    border-radius: 14px;
}

.dark .tabs {
    background: #242424;
}

.tab {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 11px 8px;
    border-radius: 11px;
    color: #666;
    font-weight: 600;
}

.tab.active {
    background: white;
    color: #111;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.dark .tab {
    color: #aaa;
}

.dark .tab.active {
    background: #3a3a3a;
    color: white;
}

.section {
    display: none;
    max-width: 700px;
    margin: 0 auto;
    padding-bottom: 30px;
}

.section.active {
    display: block;
}

.task-input {
    display: flex;
    gap: 9px;
    margin-bottom: 15px;
}

.task-input input,
.location-row input,
.auth-input,
.language-select {
    width: 100%;
    border: 1px solid #ddd;
    background: white;
    color: #111;
    padding: 14px;
    border-radius: 13px;
    outline: none;
}

.dark .task-input input,
.dark .location-row input,
.dark .auth-input,
.dark .language-select {
    background: #222;
    color: white;
    border-color: #3a3a3a;
}

.add-button {
    width: 50px;
    border: 0;
    border-radius: 13px;
    background: #111;
    color: white;
    font-size: 27px;
}

.dark .add-button {
    background: white;
    color: black;
}

.task {
    display: flex;
    align-items: center;
    gap: 11px;
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 9px;
}

.dark .task {
    background: #222;
}

.task-check {
    width: 19px;
    height: 19px;
}

.task-text {
    flex: 1;
    word-break: break-word;
}

.task.completed .task-text {
    text-decoration: line-through;
    opacity: .45;
}

.delete-task {
    border: 0;
    background: transparent;
    color: #999;
    font-size: 23px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px 10px;
}

.prayer-header {
    margin-bottom: 18px;
}

.prayer-header h2 {
    margin: 0 0 5px;
    font-size: 25px;
}

.location {
    color: #777;
    font-size: 14px;
}

.next-prayer {
    background: #111;
    color: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 15px;
}

.dark .next-prayer {
    background: #242424;
}

.next-label {
    font-size: 11px;
    opacity: .65;
    letter-spacing: 1.5px;
    font-weight: 700;
}

.next-name {
    font-size: 29px;
    font-weight: 800;
    margin-top: 7px;
}

.next-time {
    font-size: 18px;
    margin-top: 2px;
    opacity: .8;
}

.prayer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    padding: 17px;
    border-radius: 14px;
    margin-bottom: 9px;
}

.dark .prayer {
    background: #222;
}

.prayer strong {
    font-size: 17px;
}

.settings-title {
    font-size: 28px;
    font-weight: 800;
}

.settings-subtitle {
    color: #777;
    margin: 4px 0 20px;
}

.settings-card {
    background: white;
    border-radius: 17px;
    padding: 18px;
    margin-bottom: 13px;
}

.dark .settings-card {
    background: #222;
}

.settings-card-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 800;
    color: #888;
    margin-bottom: 14px;
}

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 10px 0;
}

.setting-label {
    font-weight: 650;
}

.setting-description {
    color: #888;
    font-size: 13px;
    margin-top: 3px;
}

.setting-button {
    border: 0;
    background: #eee;
    border-radius: 10px;
    padding: 9px 14px;
    white-space: nowrap;
}

.dark .setting-button {
    background: #3a3a3a;
    color: white;
}

.setting-button.dark {
    background: #111;
    color: white;
}

.location-row {
    display: flex;
    gap: 8px;
}

.notification-button,
.auth-button {
    width: 100%;
    border: 0;
    background: #111;
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
}

.dark .notification-button,
.dark .auth-button {
    background: white;
    color: black;
}

.status {
    color: #888;
    font-size: 13px;
    margin-top: 9px;
}

.danger-button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 13px;
    background: #eee;
    color: #d00;
    font-weight: 700;
}

.dark .danger-button {
    background: #333;
}

#authCard {
    max-width: 500px;
    margin: 35px auto 20px;
    background: white;
    border-radius: 20px;
    padding: 24px;
}

.dark #authCard {
    background: #222;
}

#authCard h2 {
    margin: 0 0 7px;
    font-size: 25px;
}

.auth-subtitle {
    color: #888;
    margin-bottom: 20px;
}

.auth-input {
    display: block;
    margin-bottom: 10px;
}

.auth-button {
    margin-top: 5px;
}

.auth-error {
    display: none;
    color: #d00;
    font-size: 13px;
    margin-bottom: 10px;
}

.auth-switch {
    text-align: center;
    margin-top: 17px;
    font-size: 14px;
    color: #888;
}

.auth-switch button {
    border: 0;
    background: transparent;
    color: #111;
    font-weight: 700;
}

.dark .auth-switch button {
    color: white;
}

#userBar {
    max-width: 700px;
    margin: 0 auto 12px;
    display: none;
    padding: 10px 2px;
}

.username {
    font-weight: 750;
}

.email {
    color: #888;
    font-size: 13px;
}

.language-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.language-box {
    width: min(430px, 100%);
    background: white;
    border-radius: 24px;
    padding: 27px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.dark .language-box {
    background: #222;
    color: white;
}

.language-box h1 {
    margin: 0 0 8px;
}

.language-box p {
    color: #888;
    margin-bottom: 20px;
}

.language-option {
    width: 100%;
    padding: 15px;
    margin-top: 9px;
    border: 0;
    border-radius: 13px;
    background: #eee;
    font-weight: 700;
}

.dark .language-option {
    background: #333;
    color: white;
}

.language-option:active {
    transform: scale(.98);
}

[dir="rtl"] {
    text-align: right;
}

[dir="rtl"] .header,
[dir="rtl"] .tabs,
[dir="rtl"] .task-input,
[dir="rtl"] .location-row,
[dir="rtl"] .setting-row {
    direction: rtl;
}

[dir="rtl"] .task-text {
    text-align: right;
}
</style>
</head>

<body>

<header class="header">

    <div>
        <div class="logo">Dailyz</div>
        <div class="date" id="date"></div>
    </div>

    <div class="header-actions">

        <button
            class="icon-button"
            id="themeButton"
            type="button"
        >☾</button>

        <button
            class="icon-button"
            id="settingsButton"
            type="button"
        >⚙️</button>

    </div>

</header>


<!-- AUTH -->

<div id="authCard">

    <h2 id="authTitle"></h2>

    <div class="auth-subtitle" id="authSubtitle"></div>

    <div class="auth-error" id="authError"></div>

    <input
        class="auth-input"
        id="usernameInput"
        type="text"
        autocomplete="username"
    >

    <input
        class="auth-input"
        id="emailInput"
        type="email"
        autocomplete="email"
    >

    <input
        class="auth-input"
        id="passwordInput"
        type="password"
        autocomplete="new-password"
    >

    <input
        class="auth-input"
        id="confirmPasswordInput"
        type="password"
        autocomplete="new-password"
    >

    <button
        class="auth-button"
        id="authButton"
        type="button"
    ></button>

    <div class="auth-switch">
        <span id="switchText"></span>

        <button id="switchButton" type="button"></button>
    </div>

</div>


<!-- USER -->

<div id="userBar">

    <div class="username" id="usernameDisplay"></div>
    <div class="email" id="emailDisplay"></div>

</div>


<!-- NAV -->

<div class="tabs">

    <button
        class="tab active"
        data-tab="tasks"
        type="button"
        id="tasksTab"
    ></button>

    <button
        class="tab"
        data-tab="prayers"
        type="button"
        id="prayersTab"
    ></button>

</div>


<!-- TASKS -->

<section class="section active" id="tasks">

    <div class="task-input">

        <input
            id="taskInput"
            type="text"
            autocomplete="off"
        >

        <button
            id="addTaskButton"
            class="add-button"
            type="button"
        >+</button>

    </div>

    <div id="taskList"></div>

</section>


<!-- PRAYERS -->

<section class="section" id="prayers">

    <div class="prayer-header">

        <h2 id="prayerTitle"></h2>

        <div
            class="location"
            id="locationText"
        >
            Erbil, Iraq
        </div>

    </div>

    <div class="next-prayer">

        <div
            class="next-label"
            id="nextLabel"
        ></div>

        <div
            class="next-name"
            id="nextName"
        ></div>

        <div
            class="next-time"
            id="nextTime"
        ></div>

    </div>

    <div id="prayerList"></div>

</section>


<!-- SETTINGS -->

<section class="section" id="settings">

    <div
        class="settings-title"
        id="settingsTitle"
    ></div>

    <div
        class="settings-subtitle"
        id="settingsSubtitle"
    ></div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="accountTitle"
        ></div>

        <div class="setting-row">

            <div>
                <div
                    class="setting-label"
                    id="usernameLabel"
                ></div>

                <div
                    class="setting-description"
                    id="settingsUsername"
                >
                    Not signed in
                </div>
            </div>

        </div>

        <div class="setting-row">

            <div>
                <div
                    class="setting-label"
                    id="emailLabel"
                ></div>

                <div
                    class="setting-description"
                    id="settingsEmail"
                >
                    Not signed in
                </div>
            </div>

        </div>

    </div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="appearanceTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="darkModeLabel"
                ></div>

                <div
                    class="setting-description"
                    id="darkModeDescription"
                ></div>

            </div>

            <button
                class="setting-button"
                id="settingsThemeButton"
                type="button"
            ></button>

        </div>

    </div>


    <!-- LANGUAGE -->

    <div class="settings-card">

        <div
            class="settings-card-title"
            id="languageTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="languageLabel"
                ></div>

                <div
                    class="setting-description"
                    id="languageDescription"
                ></div>

            </div>

        </div>

        <select
            class="language-select"
            id="settingsLanguage"
        >
            <option value="en">English</option>
            <option value="ku">کوردی</option>
            <option value="ar">العربية</option>
        </select>

    </div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="prayerSettingsTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="locationLabel"
                ></div>

                <div
                    class="setting-description"
                    id="locationDescription"
                ></div>

            </div>

        </div>

        <div class="location-row">

            <input
                id="locationInput"
                type="text"
                value="Erbil, Iraq"
            >

            <button
                class="setting-button dark"
                id="updateLocationButton"
                type="button"
            ></button>

        </div>

    </div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="notificationsTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="notificationsLabel"
                ></div>

                <div
                    class="setting-description"
                    id="notificationsDescription"
                ></div>

            </div>

        </div>

        <button
            class="notification-button"
            id="notificationButton"
            type="button"
        ></button>

        <div
            class="status"
            id="notificationStatus"
        ></div>

    </div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="accountActionsTitle"
        ></div>

        <button
            class="danger-button"
            id="logoutButton"
            type="button"
        ></button>

    </div>

</section>


<!-- LANGUAGE FIRST-LAUNCH -->

<div
    class="language-overlay"
    id="languageOverlay"
    style="display:none;"
>

    <div class="language-box">

        <h1>Dailyz</h1>

        <p id="chooseLanguageText">
            Choose your language
        </p>

        <button
            class="language-option"
            data-language="en"
            type="button"
        >
            🇬🇧 English
        </button>

        <button
            class="language-option"
            data-language="ku"
            type="button"
        >
            کوردی 🇹🇯
        </button>

        <button
            class="language-option"
            data-language="ar"
            type="button"
        >
            العربية 🇮🇶
        </button>

    </div>

</div>

function t(key) {

    const language =
        translations[currentLanguage] || translations.en;

    const parts = key.split(".");

    let value = language;

    for (const part of parts) {

        value = value?.[part];

    }

    return value ?? key;

}

function clearError() {

    const error =
        document.getElementById("authError");

    error.textContent = "";
    error.style.display = "none";

}


function showError(message) {

    const error =
        document.getElementById("authError");

    error.textContent = message;
    error.style.display = "block";

}


async function createAccount() {

    clearError();

    const username =
        document.getElementById("usernameInput")
            .value.trim();

    const email =
        document.getElementById("emailInput")
            .value.trim();

    const password =
        document.getElementById("passwordInput")
            .value;

    const confirm =
        document.getElementById("confirmPasswordInput")
            .value;


    if (username.length < 2) {

        showError(t("usernameTooShort"));
        return;

    }


    if (!email) {

        showError(t("enterEmail"));
        return;

    }


    if (password.length < 6) {

        showError(t("passwordShort"));
        return;

    }


    if (password !== confirm) {

        showError(t("passwordsMismatch"));
        return;

    }


    try {

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await setDoc(
            doc(db, "users", result.user.uid),
            {
                username,
                email,
                createdAt: Date.now()
            }
        );

    } catch (error) {

        showError(error.message);

    }

}


async function login() {

    clearError();

    const email =
        document.getElementById("emailInput")
            .value.trim();

    const password =
        document.getElementById("passwordInput")
            .value;


    if (!email || !password) {

        showError(t("enterEmailPassword"));
        return;

    }


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        showError(t("incorrectLogin"));

    }

}

/* TASKS */

function getTasksCollection() {

    return collection(
        db,
        "users",
        currentUser.uid,
        "tasks"
    );

}


function stopTaskListener() {

    if (unsubscribeTasks) {

        unsubscribeTasks();

        unsubscribeTasks = null;

    }

}


function startTaskListener() {

    stopTaskListener();

    if (!currentUser) return;


    const taskQuery =
        query(
            getTasksCollection(),
            orderBy("createdAt", "asc")
        );


    unsubscribeTasks =
        onSnapshot(taskQuery, snapshot => {

            const tasks = [];

            snapshot.forEach(item => {

                tasks.push({
                    id: item.id,
                    ...item.data()
                });

            });

            renderTasks(tasks);

        });

}


function renderTasks(tasks) {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    if (!currentUser) {

        list.innerHTML =
            `<div class="empty">${t("signInTasks")}</div>`;

        return;

    }


    if (tasks.length === 0) {

        list.innerHTML =
            `<div class="empty">${t("noTasks")}</div>`;

        return;

    }


    tasks.forEach(task => {

        const row =
            document.createElement("div");

        row.className = "task";


        if (task.completed) {

            row.classList.add("completed");

        }


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = !!task.completed;


        checkbox.addEventListener(
            "change",
            async () => {

                await updateDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid,
                        "tasks",
                        task.id
                    ),
                    {
                        completed:
                            checkbox.checked
                    }
                );

            }
        );


        const text =
            document.createElement("div");

        text.className = "task-text";
        text.textContent = task.text;


        const deleteButton =
            document.createElement("button");

        deleteButton.className = "delete-task";
        deleteButton.textContent = "×";


        deleteButton.addEventListener(
            "click",
            async () => {

                await deleteDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid,
                        "tasks",
                        task.id
                    )
                );

            }
        );


        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(deleteButton);

        list.appendChild(row);

    });

}


async function addTask() {

    if (!currentUser) {

        alert(t("signInFirst"));
        return;

    }


    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    if (!text) return;


    await addDoc(
        getTasksCollection(),
        {
            text,
            completed: false,
            createdAt: Date.now()
        }
    );


    input.value = "";
    input.focus();

}

    .addEventListener(

/* PRAYER TIMES */

const prayerTimes = {

    Fajr: "03:46",
    Dhuhr: "12:20",
    Asr: "16:01",
    Maghrib: "19:04",
    Isha: "20:19"

};


function loadPrayerTimes() {

    const list =
        document.getElementById("prayerList");

    list.innerHTML = "";


    Object.entries(prayerTimes)
        .forEach(([name, time]) => {

            const row =
                document.createElement("div");

            row.className = "prayer";


            const nameElement =
                document.createElement("span");

            nameElement.textContent =
                t("prayer." + name);


            const timeElement =
                document.createElement("strong");

            timeElement.textContent = time;


            row.appendChild(nameElement);
            row.appendChild(timeElement);

            list.appendChild(row);

        });


    updateNextPrayer();

}


function updateNextPrayer() {

    const now = new Date();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let next = null;


    for (
        const [name, time]
        of Object.entries(prayerTimes)
    ) {

        const [hours, minutes] =
            time.split(":").map(Number);


        const prayerMinutes =
            hours * 60 + minutes;


        if (prayerMinutes > currentMinutes) {

            next = [name, time];
            break;

        }

    }


    if (!next) {

        next = [
            "Fajr",
            prayerTimes.Fajr
        ];

    }


    document.getElementById("nextName")
        .textContent =
        t("prayer." + next[0]);


    document.getElementById("nextTime")
        .textContent = next[1];

}


setInterval(
    updateNextPrayer,
    30000
);
