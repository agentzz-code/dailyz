<body>

<div class="app">

<!-- HEADER -->

<div class="header">

    <div>
        <div class="logo">Dailyz</div>
        <div class="date" id="date"></div>
    </div>

    <button
        class="icon-button"
        id="themeButton"
        type="button"

</div>

<div
    class="auth-card"
    id="authCard"

        Create your account
    </h2>

    <div
        class="auth-subtitle"
        id="authSubtitle"

    </div>


    <div
        class="auth-error"
        id="authError"
    ></div>

        <input
            class="auth-input"
            id="usernameInput"
            type="text"
            placeholder="Username"
            autocomplete="username"
            maxlength="30"
        >

    </div>


    <!-- EMAIL -->

    <input
        class="auth-input"
        id="emailInput"
        type="email"
        placeholder="Email"
        autocomplete="email"
    >


    <!-- PASSWORD -->

    <div class="auth-input-wrapper">

        <input
            class="auth-input password-input"
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button
            class="password-toggle"
            id="passwordToggle"
            type="button"
        >
            Show
        </button>

    </div>


    <div
        class="password-help"
        id="passwordHelp"
    >
        Password must be at least 6 characters.
    </div>


    <!-- CONFIRM PASSWORD -->

    <div
        class="auth-input-wrapper"
        id="confirmWrapper"
    >

        <input
            class="auth-input password-input"
            id="confirmPasswordInput"
            type="password"
            placeholder="Confirm password"
            autocomplete="new-password"
        >

    </div>


    <button
        class="auth-button"
        id="authButton"
        type="button"
    >
        Create Account
    </button>


    <div class="auth-switch">

        <span id="switchText">
            Already have an account?
        </span>

        <button
            id="switchAuthButton"
            type="button"
        >
            Sign In
        </button>

    </div>

</div>


<!-- USER -->

<div
    class="user-bar"
    id="userBar"
>

    <div class="user-info">

        <div
            class="username-display"
            id="usernameDisplay"
        ></div>

        <div
            class="email-display"
            id="emailDisplay"
        ></div>

    </div>

    <button
        class="logout-button"
        id="logoutButton"
        type="button"
    >
        Log Out
    </button>

</div>


<!-- TABS -->

<div class="tabs">

    <button
        class="tab active"
        type="button"
        data-page="tasks"
    >
        Tasks
    </button>

    <button
        class="tab"
        type="button"
        data-page="prayers"
    >
        Prayer Times
    </button>

</div>


<!-- TASKS -->

<div
    class="section active"
    id="tasks"
>

    <div class="task-input">

        <input
            id="taskInput"
            type="text"
            placeholder="Add a task..."
            autocomplete="off"
        >

        <button
            id="addTaskButton"
            class="add-button"
            type="button"
        >
            +
        </button>

    </div>

    <div id="taskList"></div>

</div>


<!-- PRAYERS -->

<div
    class="section"
    id="prayers"
>

    <div class="prayer-header">

        <h2>Prayer Times</h2>

        <div
            class="location"
            id="locationText"
        >
            Erbil, Iraq
        </div>

    </div>


    <div class="next-prayer">

        <div class="next-label">
            NEXT PRAYER
        </div>

        <div
            class="next-name"
            id="nextName"
        >
            Loading...
        </div>

        <div
            class="next-time"
            id="nextTime"
        >
            --:--
        </div>

    </div>


    <div id="prayerList"></div>


    <div class="settings-card">

        <div class="settings-title">
            Prayer settings
        </div>

        <div class="location-row">

            <input
                id="locationInput"
                type="text"
                value="Erbil, Iraq"
                placeholder="City, Country"
            >

            <button
                id="updateLocationButton"
                class="small-button"
                type="button"
            >
                Update
            </button>

        </div>


        <button
            id="notificationButton"
            class="notification-button"
            type="button"
        >
            🔔 Enable Prayer Notifications
        </button>

        <div
            id="notificationStatus"
            class="status"
        >
            Notifications are disabled.
        </div>

    </div>

</div>

</div>

<script type="module"> /* ========================================= FIREBASE ========================================= */ import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js"; import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js"; import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, setDoc, getDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyBZs-JcWpgc9LHbhMJT9l5AdTBvYOEFMZ8", authDomain: "dailyz-web.firebaseapp.com", projectId: "dailyz-web", storageBucket: "dailyz-web.firebasestorage.app", messagingSenderId: "1031947329415", appId: "1:1031947329415:web:475f3f0d7449992fc73d22" }; const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); let currentUser = null; let unsubscribeTasks = null; let signUpMode = true; /* ========================================= DATE ========================================= */ function updateDate() { document.getElementById("date").textContent = new Date().toLocaleDateString( undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" } ); } /* ========================================= AUTH ERROR ========================================= */ function showError(message) { const box = document.getElementById("authError"); box.textContent = message; box.style.display = "block"; } function clearError() { const box = document.getElementById("authError"); box.textContent = ""; box.style.display = "none"; } /* ========================================= AUTH MODE ========================================= */ function updateAuthMode() { const title = document.getElementById( "authTitle" ); const subtitle = document.getElementById( "authSubtitle" ); const usernameWrapper = document.getElementById( "usernameWrapper" ); const ============================ AUTH STATE ========================================= */ onAuthStateChanged( auth, async function(user) { currentUser = user; const authCard = document.getElementById( "authCard" ); const userBar = document.getElementById( "userBar" ); if (user) { authCard.style.display = "none"; userBar.style.display = "flex"; document.getElementById( "emailDisplay" ).textContent = user.email; try { const profile = await getDoc( doc( db, "users", user.uid ) ); if ( profile.exists() ) { document.getElementById( "usernameDisplay" ).textContent = profile.data().username; } else { document.getElementById( "usernameDisplay" ).textContent = "User"; } } catch { document.getElementById( "usernameDisplay" ).textContent = "User"; } startTaskListener(); } else { authCard.style.display = "block"; userBar.style.display = "none"; stopTaskListener(); renderTasks([]); } } ); /* ========================================= LOG OUT ========================================= */ document .getElementById( "logoutButton" ) .addEventListener( "click", async function() { await signOut(auth); } ); /* ========================================= FIRESTORE TASKS ========================================= */ function getTaskCollection() { return collection( db, "users", currentUser.uid, "tasks" ); } function startTaskListener() { stopTaskListener(); if (!currentUser) { return; } const taskQuery = query( getTaskCollection(), orderBy( "createdAt", "asc" ) ); unsubscribeTasks = onSnapshot( taskQuery, function(snapshot) { const tasks = []; snapshot.forEach( function(taskDoc) { tasks.push({ id: taskDoc.id, ...taskDoc.data() }); } ); renderTasks(tasks); } ); } function stopTaskListener() { if (unsubscribeTasks) { unsubscribeTasks(); unsubscribeTasks = null; } } /* ========================================= RENDER TASKS ========================================= */ function renderTasks(tasks) { const container = document.getElementById( "taskList" ); container.innerHTML = ""; if (!currentUser) { co ementById( "addTaskButton" ) .addEventListener( "click", addTask ); document .getElementById( "taskInput" ) .addEventListener( "keydown", function(event) { if ( event.key === "Enter" ) { event.preventDefault(); addTask(); } } ); /* ========================================= DARK MODE ========================================= */ function loadDarkMode() { const dark = localStorage.getItem( "dailyz_dark" ) === "true"; document.body.classList.toggle( "dark", dark ); document.getElementById( "themeButton" ).textContent = dark ? "☀" : "☾"; } function toggleDarkMode() { const dark = !document.body.classList.contains( "dark" ); document.body.classList.toggle( "dark", dark ); localStorage.setItem( "dailyz_dark", String(dark) ); document.getElementById( "themeButton" ).textContent = dark ? "☀" : "☾"; } document .getElementById( "themeButton" ) .addEventListener( "click", toggleDarkMode ); /* ========================================= TABS ========================================= */ document .querySelectorAll(".tab") .forEach( function(tab) { tab.addEventListener( "click", function() { document .querySelectorAll(".tab") .forEach( function(other) { other.classList.remove( "active" ); } ); document .querySelectorAll(".section") .forEach( function(section) { section.classList.remove( "active" ); } ); tab.classList.add( "active" ); document .getElementById( tab.dataset.page ) .classList.add( "active" ); } ); } ); /* ========================================= PRAYER TIMES ========================================= */ const prayerTimes = { Fajr: "03:46", Dhuhr: "12:20", Asr: "16:01", Maghrib: "19:04", Isha: "20:19" }; function loadPrayerTimes() { const container = document.getElementById( "prayerList" ); container.innerHTML = ""; Object.entries( prayerTimes ).forEach( function([name, time]) { const row = document.createElement( "div" ); row.className = "prayer-row"; const nameElement = document.createElement( "span" ); nameElement.textContent = name; const timeElement = document.create
