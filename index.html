
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily.KRD">

<title>Daily.KRD</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;
}

:root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,.92);
    --surface-solid: #ffffff;
    --surface-2: #e9e9ed;
    --surface-3: #eeeeef;
    --text: #111111;
    --muted: #777777;
    --border: #dddddf;
    --button: #111111;
    --button-text: #ffffff;
    --active: #ffffff;
    --danger-bg: #eeeeee;
    --danger: #d00000;
    --overlay: rgba(0,0,0,.55);
    --shadow: 0 12px 35px rgba(0,0,0,.08);
}

body.dark {
    --bg: #0d0d0f;
    --surface: rgba(30,30,33,.96);
    --surface-solid: #1e1e21;
    --surface-2: #29292d;
    --surface-3: #333338;
    --text: #ffffff;
    --muted: #a4a4aa;
    --border: #3b3b40;
    --button: #ffffff;
    --button-text: #111111;
    --active: #3b3b40;
    --danger-bg: #333338;
    --danger: #ff6b6b;
    --overlay: rgba(0,0,0,.72);
    --shadow: 0 15px 45px rgba(0,0,0,.35);
}

html,
body {
    background: var(--bg);
    color: var(--text);
    transition:
        background .25s ease,
        color .25s ease;
}

body {
    padding:
        env(safe-area-inset-top)
        18px
        env(safe-area-inset-bottom)
        18px;
    overflow-x: hidden;
}

/* MOTION BACKGROUND */

.motion-bg {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    pointer-events: none;
    background: var(--bg);
    transition: background .25s ease;
}

.motion-orb {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .16;
    animation: floatOrb 14s ease-in-out infinite alternate;
}

.motion-orb.one {
    background: #777;
    top: 5%;
    left: -80px;
}

.motion-orb.two {
    background: #aaa;
    right: -90px;
    top: 45%;
    animation-delay: -4s;
}

.motion-orb.three {
    background: #555;
    bottom: -100px;
    left: 35%;
    animation-delay: -8s;
}

body.dark .motion-orb {
    opacity: .22;
}

@keyframes floatOrb {
    0% {
        transform: translate3d(0,0,0) scale(1);
    }

    50% {
        transform: translate3d(50px,-30px,0) scale(1.15);
    }

    100% {
        transform: translate3d(-30px,40px,0) scale(.9);
    }
}

/* EMOJIS */

.emoji {
    position: fixed;
    z-index: -5;
    pointer-events: none;
    opacity: .10;
    font-size: 35px;
    animation: emojiFloat linear infinite;
}

.e1 {
    left: 8%;
    bottom: -50px;
    animation-duration: 18s;
}

.e2 {
    left: 70%;
    bottom: -60px;
    animation-duration: 23s;
    animation-delay: -8s;
}

.e3 {
    left: 42%;
    bottom: -70px;
    animation-duration: 20s;
    animation-delay: -13s;
}

@keyframes emojiFloat {
    from {
        transform: translateY(0) rotate(0deg);
    }

    to {
        transform: translateY(-115vh) rotate(360deg);
    }
}

/* GENERAL */

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
    touch-action: manipulation;
}

input,
select {
    color: var(--text);
}

/* HEADER */

.header {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 30px;
    font-weight: 850;
    letter-spacing: -1px;
}

.date {
    margin-top: 3px;
    color: var(--muted);
    font-size: 13px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 20px;
}

/* TABS */

.tabs {
    max-width: 700px;
    margin: 10px auto 18px;
    display: flex;
    gap: 3px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 14px;
}

.tab {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 11px 8px;
    border-radius: 11px;
    font-weight: 650;
}

.tab.active {
    background: var(--active);
    color: var(--text);
    box-shadow: var(--shadow);
}

/* SECTIONS */

.section {
    display: none;
    max-width: 700px;
    margin: 0 auto;
    padding-bottom: 40px;
}

.section.active {
    display: block;
}

/* COMMON SURFACES */

.card,
.task,
.selected-day,
.calendar-card,
.settings-card,
.prayer,
#authCard {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* TASKS */

.selected-day {
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-weight: 700;
}

.task-input {
    display: flex;
    gap: 9px;
    margin-bottom: 15px;
}

.task-input input,
.location-row input,
.auth-input,
.task-date-input,
.repeat-select,
.language-select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 14px;
    border-radius: 13px;
    outline: none;
}

.task-input input::placeholder,
.auth-input::placeholder,
.location-row input::placeholder {
    color: var(--muted);
}

.add-button {
    width: 52px;
    border: 0;
    border-radius: 13px;
    background: var(--button);
    color: var(--button-text);
    font-size: 27px;
}

.task {
    display: flex;
    align-items: center;
    gap: 11px;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 9px;
}

.task-check {
    width: 19px;
    height: 19px;
}

.task-text {
    flex: 1;
    word-break: break-word;
}

.task-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

.task.completed .task-text {
    text-decoration: line-through;
    opacity: .45;
}

.delete-task {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 23px;
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
}

/* TASK OPTIONS */

.task-options {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 15px;
}

.option-row {
    margin-bottom: 12px;
}

.option-row:last-child {
    margin-bottom: 0;
}

.option-row label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 6px;
    font-weight: 650;
}

.repeat-days {
    display: none;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 10px;
}

.repeat-days.active {
    display: grid;
}

.repeat-day {
    border: 0;
    border-radius: 9px;
    padding: 9px 3px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 12px;
}

.repeat-day.active {
    background: var(--button);
    color: var(--button-text);
}

/* CALENDAR */

.calendar-card {
    border-radius: 20px;
    padding: 16px;
}

.calendar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.calendar-month {
    font-size: 20px;
    font-weight: 800;
}

.calendar-nav {
    display: flex;
    gap: 6px;
}

.calendar-nav button {
    border: 0;
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    width: 38px;
    height: 38px;
}

.calendar-weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.calendar-weekdays {
    margin-bottom: 5px;
}

.calendar-weekdays div {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 6px 0;
}

.calendar-day {
    min-height: 43px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    position: relative;
}

.calendar-day:hover {
    background: var(--surface-2);
}

.calendar-day.other-month {
    opacity: .25;
}

.calendar-day.selected {
    background: var(--button);
    color: var(--button-text);
}

.calendar-day.today {
    box-shadow: inset 0 0 0 2px var(--text);
}

.calendar-dot {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text);
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
}

/* PRAYERS */

.prayer-header {
    margin-bottom: 15px;
}

.prayer-header h2 {
    margin: 0 0 4px;
}

.location {
    color: var(--muted);
    font-size: 13px;
}

.next-prayer {
    background: var(--button);
    color: var(--button-text);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 14px;
}

.next-label {
    font-size: 11px;
    opacity: .65;
    font-weight: 700;
    letter-spacing: .8px;
}

.next-name {
    font-size: 27px;
    font-weight: 850;
    margin-top: 5px;
}

.next-time {
    font-size: 18px;
    margin-top: 3px;
}

.prayer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 8px;
}

.prayer strong {
    font-size: 16px;
}

/* SETTINGS */

.settings-title {
    font-size: 28px;
    font-weight: 850;
}

.settings-subtitle {
    color: var(--muted);
    margin: 4px 0 18px;
}

.settings-card {
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 12px;
}

.settings-card-title {
    font-size: 16px;
    font-weight: 750;
    margin-bottom: 9px;
}

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 10px 0;
}

.setting-label {
    font-weight: 650;
}

.setting-description {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
}

.setting-button {
    border: 0;
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 14px;
    white-space: nowrap;
}

.setting-button.dark {
    background: var(--button);
    color: var(--button-text);
}

.location-row {
    display: flex;
    gap: 8px;
}

.notification-button,
.auth-button {
    width: 100%;
    border: 0;
    background: var(--button);
    color: var(--button-text);
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
}

.status {
    color: var(--muted);
    font-size: 13px;
    margin-top: 9px;
}

.danger-button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 13px;
    background: var(--danger-bg);
    color: var(--danger);
    font-weight: 700;
}

/* WELCOME */

.welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: var(--bg);
    color: var(--text);
}

.welcome-box {
    width: min(440px, 100%);
    text-align: center;
}

.welcome-logo {
    font-size: 43px;
    font-weight: 900;
    margin-bottom: 8px;
}

.welcome-subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

.welcome-button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 15px;
    margin-top: 9px;
    background: var(--button);
    color: var(--button-text);
    font-weight: 750;
}

.welcome-button.secondary {
    background: var(--surface-2);
    color: var(--text);
}

.welcome-button.guest {
    background: transparent;
    color: var(--muted);
}

/* AUTH */

.auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 8000;
    background: var(--overlay);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-overlay.active {
    display: flex;
}

#authCard {
    width: min(500px, 100%);
    border-radius: 22px;
    padding: 24px;
}

#authCard h2 {
    margin: 0 0 7px;
    font-size: 25px;
}

.auth-subtitle {
    color: var(--muted);
    margin-bottom: 20px;
}

.auth-input {
    display: block;
    margin-bottom: 10px;
}

.auth-error {
    display: none;
    color: #ff5555;
    font-size: 13px;
    margin-bottom: 10px;
}

.auth-switch {
    text-align: center;
    margin-top: 17px;
    font-size: 14px;
    color: var(--muted);
}

.auth-switch button {
    border: 0;
    background: transparent;
    color: var(--text);
    font-weight: 700;
}

.close-auth {
    float: right;
    border: 0;
    background: transparent;
    font-size: 25px;
    color: var(--muted);
}

/* USER */

#userBar {
    max-width: 700px;
    margin: 0 auto 12px;
    display: none;
    padding: 10px 2px;
}

.username {
    font-weight: 750;
}

.email {
    color: var(--muted);
    font-size: 13px;
}

/* LANGUAGE */

.language-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.language-box {
    width: min(430px, 100%);
    background: var(--surface-solid);
    color: var(--text);
    border-radius: 24px;
    padding: 27px;
    text-align: center;
    box-shadow: var(--shadow);
}

.language-box h1 {
    margin: 0 0 8px;
}

.language-box p {
    color: var(--muted);
    margin-bottom: 20px;
}

.language-option {
    width: 100%;
    padding: 15px;
    margin-top: 9px;
    border: 0;
    border-radius: 13px;
    background: var(--surface-2);
    color: var(--text);
    font-weight: 700;
}

.language-option:active {
    transform: scale(.98);
}

/* RTL */

[dir="rtl"] {
    text-align: right;
}

[dir="rtl"] .header,
[dir="rtl"] .tabs,
[dir="rtl"] .task-input,
[dir="rtl"] .location-row,
[dir="rtl"] .setting-row,
[dir="rtl"] .calendar-head,
[dir="rtl"] .prayer {
    direction: rtl;
}

[dir="rtl"] .task-text {
    text-align: right;
}

[dir="rtl"] .calendar-weekdays,
[dir="rtl"] .calendar-grid {
    direction: rtl;
}

[dir="rtl"] .next-prayer {
    text-align: right;
}

</style>
</head>

<body>

<div class="motion-bg">
    <div class="motion-orb one"></div>
    <div class="motion-orb two"></div>
    <div class="motion-orb three"></div>
</div>

<div class="emoji e1">✨</div>
<div class="emoji e2">📅</div>
<div class="emoji e3">✓</div>


<header class="header">

    <div>
        <div class="logo">Daily.KRD</div>
        <div class="date" id="date"></div>
    </div>

    <div class="header-actions">

        <button
            class="icon-button"
            id="themeButton"
            type="button"
        >☾</button>

        <button
            class="icon-button"
            id="settingsButton"
            type="button"
        >⚙️</button>

    </div>

</header>


<div class="tabs">

    <button
        class="tab active"
        id="tasksTab"
        data-tab="tasks"
        type="button"
    ></button>

    <button
        class="tab"
        id="calendarTab"
        data-tab="calendar"
        type="button"
    ></button>

    <button
        class="tab"
        id="prayersTab"
        data-tab="prayers"
        type="button"
    ></button>

</div>


<!-- TASKS -->

<section
    class="section active"
    id="tasks"
>

    <div
        class="selected-day"
        id="selectedDayText"
    ></div>

    <div class="task-input">

        <input
            id="taskInput"
            type="text"
            autocomplete="off"
        >

        <button
            id="addTaskButton"
            class="add-button"
            type="button"
        >+</button>

    </div>

    <div class="task-options">

        <div class="option-row">

            <label id="dateLabel"></label>

            <input
                class="task-date-input"
                id="taskDateInput"
                type="date"
            >

        </div>

        <div class="option-row">

            <label id="repeatLabel"></label>

            <select
                class="repeat-select"
                id="repeatSelect"
            >
                <option value="once" id="repeatOnce"></option>
                <option value="daily" id="repeatDaily"></option>
                <option value="weekly" id="repeatWeekly"></option>
                <option value="custom" id="repeatCustom"></option>
            </select>

        </div>

        <div
            class="repeat-days"
            id="repeatDays"
        >

            <button class="repeat-day" data-day="0" type="button"></button>
            <button class="repeat-day" data-day="1" type="button"></button>
            <button class="repeat-day" data-day="2" type="button"></button>
            <button class="repeat-day" data-day="3" type="button"></button>
            <button class="repeat-day" data-day="4" type="button"></button>
            <button class="repeat-day" data-day="5" type="button"></button>
            <button class="repeat-day" data-day="6" type="button"></button>

        </div>

    </div>

    <div id="taskList"></div>

</section>


<!-- CALENDAR -->

<section
    class="section"
    id="calendar"
>

    <div class="calendar-card">

        <div class="calendar-head">

            <div
                class="calendar-month"
                id="calendarMonth"
            ></div>

            <div class="calendar-nav">

                <button
                    id="previousMonth"
                    type="button"
                >‹</button>

                <button
                    id="todayButton"
                    type="button"
                ></button>

                <button
                    id="nextMonth"
                    type="button"
                >›</button>

            </div>

        </div>

        <div
            class="calendar-weekdays"
            id="calendarWeekdays"
        ></div>

        <div
            class="calendar-grid"
            id="calendarGrid"
        ></div>

    </div>

</section>


<!-- PRAYERS -->

<section
    class="section"
    id="prayers"
>

    <div class="prayer-header">

        <h2 id="prayerTitle"></h2>

        <div
            class="location"
            id="locationText"
        >
            Erbil, Iraq
        </div>

    </div>

    <div class="next-prayer">

        <div
            class="next-label"
            id="nextLabel"
        ></div>

        <div
            class="next-name"
            id="nextName"
        ></div>

        <div
            class="next-time"
            id="nextTime"
        >--:--</div>

    </div>

    <div id="prayerList"></div>

</section>


<!-- SETTINGS -->

<section
    class="section"
    id="settings"
>

    <div
        class="settings-title"
        id="settingsTitle"
    ></div>

    <div
        class="settings-subtitle"
        id="settingsSubtitle"
    ></div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="accountTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="usernameLabel"
                ></div>

                <div
                    class="setting-description"
                    id="settingsUsername"
                ></div>

            </div>

        </div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="emailLabel"
                ></div>

                <div
                    class="setting-description"
                    id="settingsEmail"
                ></div>

            </div>

        </div>

        <button
            class="setting-button dark"
            id="accountButton"
            type="button"
        ></button>

    </div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="appearanceTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="darkModeLabel"
                ></div>

                <div
                    class="setting-description"
                    id="darkModeDescription"
                ></div>

            </div>

            <button
                class="setting-button"
                id="settingsThemeButton"
                type="button"
            ></button>

        </div>

    </div>


    <div class="settings-card">

        <div
            class="settings-card-title"
            id="languageTitle"
        ></div>

        <div class="setting-row">

            <div>

                <div
                    class="setting-label"
                    id="languageLabel"
                ></div>

                <div
                    class="setting-description"
                    id="languageDescription"
                ></div>

            </div>

            <select
                class="language-select"
                id="settingsLanguage"
                style="max-width:150px;"
            >

let currentLanguage =
    localStorage.getItem(
        "dailykrd_language"
    ) || null;


function t(key) {

    const language =
        translations[currentLanguage]
        || translations.en;

    const parts =
        key.split(".");

    let value = language;

    for (const part of parts) {

        value =
            value?.[part];

    }

    return value ?? key;

}


/* DATE HELPERS */

function getTodayKey() {

    const d = new Date();

    return [
        d.getFullYear(),
        String(
            d.getMonth() + 1
        ).padStart(2,"0"),
        String(
            d.getDate()
        ).padStart(2,"0")
    ].join("-");

}


function parseDateKey(key) {

    const [
        y,
        m,
        d
    ] =
        key.split("-").map(Number);

    return new Date(
        y,
        m - 1,
        d
    );

}


function formatDateKey(key) {

    const d =
        parseDateKey(key);

    const localeMap = {

        en: "en-US",
        ku: "ku-Arab",
        ar: "ar-IQ"

    };

    return d.toLocaleDateString(
        localeMap[currentLanguage] || "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );

}


function updateDate() {

    document.getElementById(
        "date"
    ).textContent =
        formatDateKey(
            getTodayKey()
        );

}


function getDateKeyFromDate(date) {

    return [
        date.getFullYear(),
        String(
            date.getMonth() + 1
        ).padStart(2,"0"),
        String(
            date.getDate()
        ).padStart(2,"0")
    ].join("-");

}

async function createAccount() {

    clearError();

    const username =
        document.getElementById(
            "usernameInput"
        ).value.trim();

    const email =
        document.getElementById(
            "emailInput"
        ).value.trim();

    const password =
        document.getElementById(
            "passwordInput"
        ).value;

    const confirm =
        document.getElementById(
            "confirmPasswordInput"
        ).value;


    if (username.length < 2) {

        showError(
            t("usernameTooShort")
        );

        return;

    }

    if (!email) {

        showError(
            t("enterEmail")
        );

        return;

    }

    if (password.length < 6) {

        showError(
            t("passwordShort")
        );

        return;

    }

    if (password !== confirm) {

        showError(
            t("passwordsMismatch")
        );

        return;

    }


    try {

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await setDoc(
            doc(
                db,
                "users",
                result.user.uid
            ),
            {
                username,
                email,
                language: currentLanguage,
                createdAt: Date.now()
            }
        );

        document.getElementById(
            "authOverlay"
        ).classList.remove(
            "active"
        );

    } catch (error) {

        showError(
            error.message
        );

    }

}

/* TASK COLLECTION */

function getTasksCollection() {

    return collection(
        db,
        "users",
        currentUser.uid,
        "tasks"
    );

}


function stopTaskListener() {

    if (unsubscribeTasks) {

        unsubscribeTasks();

        unsubscribeTasks =
            null;

    }

}


function startTaskListener() {

    stopTaskListener();

    if (!currentUser) return;


    const taskQuery =
        query(
            getTasksCollection(),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeTasks =
        onSnapshot(
            taskQuery,
            snapshot => {

                const tasks = [];

                snapshot.forEach(
                    item => {

                        tasks.push({
                            id: item.id,
                            ...item.data()
                        });

                    }
                );

                renderTasks(tasks);
                renderCalendar();

            }
        );

}


/* TASK DATE MATCHING */

function taskOccursOnDate(
    task,
    dateKey
) {

    const start =
        task.date ||
        getTodayKey();

    const target =
        parseDateKey(
            dateKey
        );

    const startDate =
        parseDateKey(
            start
        );


    if (target < startDate) {

        return false;

    }


    if (
        !task.repeat ||
        task.repeat === "once"
    ) {

        return dateKey === start;

    }


    if (
        task.repeat === "daily"
    ) {

        return true;

    }


    if (
        task.repeat === "weekly"
    ) {

        return (
            target.getDay() ===
            startDate.getDay()
        );

    }


    if (
        task.repeat === "custom" &&
        Array.isArray(task.days)
    ) {

        return task.days.includes(
            target.getDay()
        );

    }


    return false;

}


/* TASKS */

function renderTasks(tasks) {

    const list =
        document.getElementById(
            "taskList"
        );

    list.innerHTML = "";


    document.getElementById(
        "selectedDayText"
    ).textContent =
        formatDateKey(
            selectedDate
        );


    if (!currentUser) {

        const localTasks =
            guestTasks.filter(
                task =>
                    taskOccursOnDate(
                        task,
                        selectedDate
                    )
            );

        renderTaskArray(
            localTasks,
            list
        );

        return;

    }


    const todayTasks =
        tasks.filter(
            task =>
                taskOccursOnDate(
                    task,
                    selectedDate
                )
        );


    renderTaskArray(
        todayTasks,
        list
    );

}


function renderTaskArray(
    tasks,
    list
) {

    if (!tasks.length) {

        list.innerHTML =
            `<div class="empty">${t("noTasks")}</div>`;

        return;

    }


    tasks.forEach(
        task => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "task";


            if (
                task.completedDates?.includes(
                    selectedDate
                )
            ) {

                row.classList.add(
                    "completed"
                );

            }


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "task-check";


            checkbox.checked =
                task.repeat &&
                task.repeat !== "once"
                ? (
                    task.completedDates?.includes(
                        selectedDate
                    ) || false
                )
                : !!task.completed;


            checkbox.addEventListener(
                "change",
                async () => {

                    await toggleTaskCompletion(
                        task,
                        checkbox.checked
                    );

                }
            );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "task-text";


            const title =
                document.createElement(
                    "div"
                );

            title.textContent =
                task.text;


            content.appendChild(
                title
            );


            if (
                task.repeat &&
                task.repeat !== "once"
            ) {

                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "task-meta";

                meta.textContent =
                    task.repeat === "daily"
                    ? t("daily")
                    : task.repeat === "weekly"
                    ? t("weekly")
                    : t("custom");

                content.appendChild(
                    meta
                );

            }


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-task";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                async () => {

                    await deleteTask(
                        task
                    );

                }
            );


            row.appendChild(
                checkbox
            );

            row.appendChild(
                content
            );

            row.appendChild(
                deleteButton
            );

            list.appendChild(
                row
            );

        }
    );

}

async function addTask() {

            )
        ).map(
            button =>
                Number(
                    button.dataset.day
                )
        );


    const task = {

        text,

        date,

        repeat,

        days:
            repeat === "custom"
            ? days
            : [],

        completed: false,

        completedDates: [],

        createdAt:
            Date.now()

    };


    if (!currentUser) {

        task.id =
            "guest_" +
            Date.now();

        guestTasks.push(
            task
        );

            "dailykrd_guest_tasks",

            )
        );

        input.value = "";

        renderTasks([]);

        renderCalendar();

        return;

    await addDoc(
        getTasksCollection(),
        task
    );


    input.value = "";

    input.focus();

/* TASK COMPLETION */

async function toggleTaskCompletion(
    task,
    checked
) {

    if (!currentUser) {

        const found =
            guestTasks.find(
                item =>
                    item.id ===
                    task.id
            );

        if (!found) return;


        found.completedDates =
            found.completedDates || [];


        if (checked) {

            if (
                !found.completedDates.includes(
                    selectedDate
                )
            ) {

                found.completedDates.push(
                    selectedDate
                );

            }

        } else {

            found.completedDates =
                found.completedDates.filter(
                    d =>
                        d !== selectedDate
                );

        }


        localStorage.setItem(
            "dailykrd_guest_tasks",
            JSON.stringify(
                guestTasks
            )
        );

        renderTasks([]);

        return;

    }


    if (
        task.repeat &&
        task.repeat !== "once"
    ) {

        let dates =
            task.completedDates ||
            [];


        if (checked) {

            if (
                !dates.includes(
                    selectedDate
                )
            ) {

                dates.push(
                    selectedDate
                );

            }

        } else {

            dates =
                dates.filter(
                    d =>
                        d !== selectedDate
                );

        }


        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid,
                "tasks",
                task.id
            ),
            {
                completedDates:
                    dates
            }
        );

    } else {

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid,
                "tasks",
                task.id
            ),
            {
                completed:
                    checked
            }
        );

    }

}

/* CALENDAR */

function getAllVisibleTasks() {

    if (currentUser) {

        return [];

    }

    return guestTasks;

function renderCalendar() {

    const month =
        document.getElementById(
            "calendarMonth"
        );

    const grid =
        document.getElementById(
            "calendarGrid"
        );

    const weekdays =
        document.getElementById(
            "calendarWeekdays"
        );


    if (
        !month ||
        !grid ||
        !weekdays
    ) return;


    const locale =
        currentLanguage === "ar"
        ? "ar-IQ"
        : currentLanguage === "ku"
        ? "ku-Arab"
        : "en-US";


    month.textContent =
        calendarDate.toLocaleDateString(
            locale,
            {
                month: "long",
                year: "numeric"
            }
        );


    weekdays.innerHTML = "";


    t("weekdays").forEach(
        day => {

            const el =
                document.createElement(
                    "div"
                );

            el.textContent =
                day;

            weekdays.appendChild(
                el
            );

        }
    );


    grid.innerHTML = "";


    const year =
        calendarDate.getFullYear();

    const monthIndex =
        calendarDate.getMonth();

    const firstDay =
        new Date(
            year,
            monthIndex,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            year,
            monthIndex + 1,
            0
        ).getDate();


    const previousDays =
        new Date(
            year,
            monthIndex,
            0
        ).getDate();


    for (
        let i = firstDay - 1;
        i >= 0;
        i--
    ) {

        createCalendarDay(
            previousDays - i,
            true,
            year,
            monthIndex - 1,
            grid
        );

    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        createCalendarDay(
            day,
            false,
            year,
            monthIndex,
            grid
        );

    }


    const total =
        grid.children.length;

    const remaining =
        total % 7 === 0
        ? 0
        : 7 - (total % 7);


    for (
        let day = 1;
        day <= remaining;
        day++
    ) {

        createCalendarDay(
            day,
            true,
            year,
            monthIndex + 1,
            grid
        );

    }

}


function createCalendarDay(
    day,
    otherMonth,
    year,
    month,
    grid
) {

    const date =
        new Date(
            year,
            month,
            day
        );

    const key =
        getDateKeyFromDate(
            date
        );


    const button =
        document.createElement(
            "button"
        );

    button.type =
        "button";

    button.className =
        "calendar-day";


    if (otherMonth) {

        button.classList.add(
            "other-month"
        );

    }


    if (
        key === selectedDate
    ) {

        button.classList.add(
            "selected"
        );

    }


    if (
        key === getTodayKey()
    ) {

        button.classList.add(
            "today"
        );

    }


    button.textContent =
        day;


    const hasTask =
        guestTasks.some(
            task =>
                taskOccursOnDate(
                    task,
                    key
                )
        );


    if (hasTask) {

        const dot =
            document.createElement(
                "span"
            );

        dot.className =
            "calendar-dot";

        button.appendChild(
            dot
        );

    }


    button.addEventListener(
        "click",
        () => {

            selectedDate =
                key;

            document.getElementById(
                "taskDateInput"
            ).value =
                selectedDate;

            renderCalendar();
            renderTasks([]);

            showSection(
                "tasks"
            );

        }
    );


    grid.appendChild(
        button
    );

}

            "dailykrd_dark"
        ) === "true";


    document.body.classList.toggle(
        "dark",

    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";


    document.getElementById(

    ).textContent =
        dark ? "On" : "Off";

}


function toggleTheme() {

    const dark =
        !document.body.classList.contains(

        );


    localStorage.setItem(

    );


    applyTheme();

/* PRAYER TIMES */

const prayerTimes = {

    Fajr: "03:46",
    Dhuhr: "12:20",
    Asr: "16:01",
    Maghrib: "19:04",
    Isha: "20:19"

};


function loadPrayerTimes() {

    const list =
        document.getElementById(
            "prayerList"
        );

    list.innerHTML = "";


    Object.entries(
        prayerTimes
    ).forEach(
        ([name,time]) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "prayer";


            const nameElement =
                document.createElement(
                    "span"
                );

            nameElement.textContent =
                t(
                    "prayer." +
                    name
                );


            const timeElement =
                document.createElement(
                    "strong"
                );

            timeElement.textContent =
                time;


            row.appendChild(
                nameElement
            );

            row.appendChild(
                timeElement
            );

            list.appendChild(
                row
            );

        }
    );


    updateNextPrayer();

}


function updateNextPrayer() {

    const now =
        new Date();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let next =
        null;


    for (
        const [
            name,
            time
        ]
        of Object.entries(
            prayerTimes
        )
    ) {

        const [
            hours,
            minutes
        ] =
            time
                .split(":")
                .map(Number);


        const prayerMinutes =
            hours * 60 +
            minutes;


        if (
            prayerMinutes >
            currentMinutes
        ) {

            next =
                [name,time];

            break;

        }

    }


    if (!next) {

        next = [
            "Fajr",
            prayerTimes.Fajr
        ];

    }


    document.getElementById(
        "nextName"
    ).textContent =
        t(
            "prayer." +
            next[0]
        );

    document.getElementById(
        "nextTime"
    ).textContent =
        next[1];

}


setInterval(
    updateNextPrayer,
    30000
);

).addEventListener(

            );


        if (
            !("Notification" in window)
        ) {

            status.textContent =
                t(
                    "notificationsUnsupported"
                );

            return;

        }


        const permission =
            await Notification
                .requestPermission();


        if (
            permission ===
            "granted"
        ) {

            status.textContent =
                t(
                    "notificationsEnabled"
                );

        } else {

            status.textContent =
                t(
                    "notificationsDisabled"
                );

    }
);
