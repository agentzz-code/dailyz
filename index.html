<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dailyz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f7;
    color: #171717;
    transition: 0.25s;
}

body.dark {
    background: #111;
    color: #fff;
}

.app {
    max-width: 700px;
    margin: auto;
    padding: 25px 18px 50px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
}

.date {
    margin-top: 5px;
    color: #777;
}

.icon-button {
    border: none;
    background: #e5e5e5;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 22px;
    cursor: pointer;
}

body.dark .icon-button {
    background: #333;
    color: white;
}

.tabs {
    display: flex;
    gap: 8px;
    background: #e8e8e8;
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    border: none;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    background: transparent;
    font-weight: 600;
}

.tab.active {
    background: white;
}

body.dark .tabs {
    background: #222;
}

body.dark .tab {
    color: white;
}

body.dark .tab.active {
    background: #444;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.task-input {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.task-input input {
    flex: 1;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

body.dark input {
    background: #222;
    color: white;
    border-color: #444;
}

.add-button {
    width: 52px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
}

body.dark .task {
    background: #222;
}

.task span {
    flex: 1;
}

.task.completed span {
    text-decoration: line-through;
    opacity: 0.5;
}

.task button {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
}

.prayer-header {
    margin-bottom: 20px;
}

.prayer-header h2 {
    margin-bottom: 5px;
}

.location {
    color: #777;
}

.next-prayer {
    background: #111;
    color: white;
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 20px;
}

.next-label {
    font-size: 12px;
    opacity: 0.7;
}

.next-name {
    font-size: 28px;
    font-weight: bold;
    margin-top: 5px;
}

.next-time {
    font-size: 40px;
    font-weight: bold;
    margin-top: 5px;
}

.prayer-item {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    background: white;
    border-radius: 12px;
    margin-bottom: 8px;
}

body.dark .prayer-item {
    background: #222;
}

.settings-card {
    margin-top: 20px;
    padding: 20px;
    background: white;
    border-radius: 16px;
}

body.dark .settings-card {
    background: #222;
}

.settings-title {
    font-weight: bold;
    margin-bottom: 15px;
}

.location-row {
    display: flex;
    gap: 8px;
}

.location-row input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.small-button,
.notification-button {
    border: none;
    padding: 12px 15px;
    border-radius: 10px;
    cursor: pointer;
    background: #111;
    color: white;
}

.notification-button {
    width: 100%;
    margin-top: 12px;
}

.status {
    margin-top: 10px;
    font-size: 13px;
    color: #777;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>

</head>

<body>

<div class="app">

<header class="header">
    <div>
        <div class="logo">Dailyz</div>
        <div class="date" id="date"></div>
    </div>

```
<button class="icon-button" onclick="toggleDarkMode()" id="themeButton">
    ☾
</button>
```

</header>

<div class="tabs">

```
<button class="tab active" onclick="switchTab('tasks', this)">
    Tasks
</button>

<button class="tab" onclick="switchTab('prayers', this)">
    Prayer Times
</button>
```

</div>

<section class="section active" id="tasks">

```
<div class="task-input">

    <input
        id="taskInput"
        type="text"
        placeholder="Add a task..."
        autocomplete="off"
        onkeydown="if(event.key === 'Enter') addTask()"
    >

    <button class="add-button" onclick="addTask()">+</button>

</div>

<div class="task-list" id="taskList"></div>
```

</section>

<section class="section" id="prayers">

```
<div class="prayer-header">
    <h2>Prayer Times</h2>
    <div class="location" id="locationText">
        Loading location...
    </div>
</div>

<div class="next-prayer" id="nextPrayer">
    <div class="next-label">NEXT PRAYER</div>
    <div class="next-name" id="nextName">Loading...</div>
    <div class="next-time" id="nextTime">--:--</div>
</div>

<div class="prayer-list" id="prayerList">
    <div class="empty">Loading prayer times...</div>
</div>

<div class="settings-card">

    <div class="settings-title">
        Prayer settings
    </div>

    <div class="location-row">

        <input
            id="locationInput"
            placeholder="City, Country"
            value="Erbil, Iraq"
        >

        <button class="small-button" onclick="loadPrayerTimes()">
            Update
        </button>

    </div>

    <button
        class="notification-button"
        onclick="enableNotifications()"
    >
        🔔 Enable Prayer Notifications
    </button>

    <div class="status" id="notificationStatus">
        Notifications are disabled.
    </div>

</div>
```

</section>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("dailyzTasks")) || [];


/* DATE */

function updateDate() {

    const dateElement = document.getElementById("date");

    const now = new Date();

    dateElement.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    });
}


/* TASKS */

function saveTasks() {

    localStorage.setItem(
        "dailyzTasks",
        JSON.stringify(tasks)
    );
}


function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    if (tasks.length === 0) {

        list.innerHTML =
            '<div class="empty">No tasks yet. Add one above!</div>';

        return;
    }

    tasks.forEach((task, index) => {

        const taskElement = document.createElement("div");

        taskElement.className =
            "task" + (task.completed ? " completed" : "");

        taskElement.innerHTML = `
            <input
                type="checkbox"
                ${task.completed ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <span>${escapeHTML(task.text)}</span>

            <button onclick="deleteTask(${index})">
                🗑️
            </button>
        `;

        list.appendChild(taskElement);

    });
}


function addTask() {

    const input = document.getElementById("taskInput");

    const text = input.value.trim();

    if (!text) {
        return;
    }

    tasks.push({
        text: text,
        completed: false
    });

    saveTasks();

    renderTasks();

    input.value = "";

    input.focus();
}


function toggleTask(index) {

    tasks[index].completed =
        !tasks[index].completed;

    saveTasks();

    renderTasks();
}


function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    renderTasks();
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* TABS */

function switchTab(tabName, button) {

    document.querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });

    document.getElementById(tabName)
        .classList.add("active");

    document.querySelectorAll(".tab")
        .forEach(tab => {
            tab.classList.remove("active");
        });

    button.classList.add("active");
}


/* DARK MODE */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const isDark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "dailyzDarkMode",
        isDark
    );

    document.getElementById("themeButton").textContent =
        isDark ? "☀" : "☾";
}


function loadDarkMode() {

    const isDark =
        localStorage.getItem("dailyzDarkMode") === "true";

    if (isDark) {

        document.body.classList.add("dark");

        document.getElementById("themeButton").textContent = "☀";
    }
}


/* PRAYER TIMES */

async function loadPrayerTimes() {

    const input =
        document.getElementById("locationInput");

    const location =
        input.value.trim();

    if (!location) {
        return;
    }

    document.getElementById("locationText").textContent =
        location;

    document.getElementById("prayerList").innerHTML =
        '<div class="empty">Loading prayer times...</div>';

    try {

        const parts =
            location.split(",");

        const city =
            parts[0].trim();

        const country =
            parts.length > 1
                ? parts[1].trim()
                : "Iraq";

        const response =
            await fetch(
                `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=3`
            );

        const data =
            await response.json();

        if (
            !data.data ||
            !data.data.timings
        ) {
            throw new Error("Prayer times unavailable");
        }

        displayPrayerTimes(
            data.data.timings,
            location
        );

    } catch (error) {

        document.getElementById("prayerList").innerHTML =
            '<div class="empty">Could not load prayer times.</div>';

        document.getElementById("nextName").textContent =
            "Unavailable";

        document.getElementById("nextTime").textContent =
            "--:--";
    }
}


function displayPrayerTimes(timings, location) {

    document.getElementById("locationText").textContent =
        location;

    const prayers = [
        ["Fajr", timings.Fajr],
        ["Dhuhr", timings.Dhuhr],
        ["Asr", timings.Asr],
        ["Maghrib", timings.Maghrib],
        ["Isha", timings.Isha]
    ];

    const list =
        document.getElementById("prayerList");

    list.innerHTML = "";

    prayers.forEach(([name, time]) => {

        const item =
            document.createElement("div");

        item.className =
            "prayer-item";

        item.innerHTML = `
            <span>${name}</span>
            <strong>${time}</strong>
        `;

        list.appendChild(item);
    });

    findNextPrayer(prayers);
}


function findNextPrayer(prayers) {

    const now = new Date();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    let next = null;

    for (const [name, time] of prayers) {

        const [hours, minutes] =
            time.split(":").map(Number);

        const prayerMinutes =
            hours * 60 + minutes;

        if (prayerMinutes > currentMinutes) {

            next = [name, time];

            break;
        }
    }

    if (!next) {
        next = prayers[0];
    }

    document.getElementById("nextName").textContent =
        next[0];

    document.getElementById("nextTime").textContent =
        next[1];
}


/* NOTIFICATIONS */

function enableNotifications() {

    if (!("Notification" in window)) {

        document.getElementById("notificationStatus")
            .textContent =
            "Notifications are not supported by this browser.";

        return;
    }

    Notification.requestPermission()
        .then(permission => {

            const status =
                document.getElementById("notificationStatus");

            if (permission === "granted") {

                status.textContent =
                    "Notifications are enabled.";

            } else {

                status.textContent =
                    "Notification permission was not granted.";
            }

        });
}


/* START APP */

updateDate();

loadDarkMode();

renderTasks();

loadPrayerTimes();

</script>

</body>
</html>
