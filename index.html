<title>Dailyz</title>

<style>
    * {
        box-sizing: border-box;

    body {

        padding: 15px;

        font-size: 16px;

    body.dark .task-input input {

        border-radius: 13px;

    .empty {

    /* PRAYERS */

        margin-bottom: 18px;
    }

    .prayer-header h2 {
        margin: 0 0 5px;

    .location {

    }

</div>

<script>

/* ==========================================
   DAILYZ JAVASCRIPT
   ========================================== */


/* DATE */

function updateDate() {

    const date = new Date();

    document.getElementById("date").textContent =
        date.toLocaleDateString(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        });
}


/* ==========================================
   TASK SYSTEM
   ========================================== */

let tasks = [];


/* Load saved tasks */

function loadTasks() {

    try {

        const saved =
            localStorage.getItem("dailyz_tasks");

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {

                tasks = parsed;

            }

        }

    } catch (error) {

        console.error(
            "Error loading tasks:",
            error
        );

        tasks = [];
    }
}


/* Save tasks */

function saveTasks() {

    try {

        localStorage.setItem(
            "dailyz_tasks",
            JSON.stringify(tasks)
        );

    } catch (error) {

        console.error(
            "Error saving tasks:",
            error
        );

    }
}


/* Display tasks */

function renderTasks() {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    if (tasks.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No tasks yet. Add one above.";

        list.appendChild(empty);

        return;
    }


    tasks.forEach(function(task, index) {

        const taskElement =
            document.createElement("div");

        taskElement.className = "task";


        if (task.completed) {

            taskElement.classList.add(
                "completed"
            );

        }


        /* Checkbox */

        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className =
            "task-checkbox";

        checkbox.checked =
            Boolean(task.completed);


        checkbox.addEventListener(
            "change",
            function() {

                tasks[index].completed =
                    checkbox.checked;

                saveTasks();

                renderTasks();

            }
        );


        /* Text */

        const text =
            document.createElement("div");

        text.className = "task-text";

        text.textContent =
            task.text;


        /* Delete */

        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";

        deleteButton.className =
            "delete-button";

        deleteButton.textContent = "🗑️";

        deleteButton.setAttribute(
            "aria-label",
            "Delete task"
        );


        deleteButton.addEventListener(
            "click",
            function() {

                tasks.splice(index, 1);

                saveTasks();

                renderTasks();

            }
        );


        taskElement.appendChild(
            checkbox
        );

        taskElement.appendChild(
            text
        );

        taskElement.appendChild(
            deleteButton
        );


        list.appendChild(
            taskElement
        );

    });
}


/* Add a task */

function addTask() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();


    /* Don't add empty tasks */

    if (text === "") {

        input.focus();

        return;
    }


    tasks.push({

        text: text,

        completed: false

    });


    saveTasks();

    renderTasks();


    /* Clear input */

    input.value = "";

    input.focus();
}


/* ==========================================
   TABS
   ========================================== */

function switchTab(tabName) {

    document
        .querySelectorAll(".section")
        .forEach(function(section) {

            section.classList.remove(
                "active"
            );

        });


    const section =
        document.getElementById(tabName);


    if (section) {

        section.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(".tab")
        .forEach(function(tab) {

            tab.classList.remove(
                "active"
            );

        });


    const selectedTab =
        document.querySelector(
            '.tab[data-tab="' +
            tabName +
            '"]'
        );


    if (selectedTab) {

        selectedTab.classList.add(
            "active"
        );

    }
}


/* ==========================================
   DARK MODE
   ========================================== */

function loadDarkMode() {

    const saved =
        localStorage.getItem(
            "dailyz_dark_mode"
        );


    if (saved === "true") {

        document.body.classList.add(
            "dark"
        );

        document.getElementById(
            "themeButton"
        ).textContent = "☀";

    } else {

        document.body.classList.remove(
            "dark"
        );

        document.getElementById(
            "themeButton"
        ).textContent = "☾";
    }
}


function toggleDarkMode() {

    const dark =
        document.body.classList.toggle(
            "dark"
        );


    localStorage.setItem(
        "dailyz_dark_mode",
        String(dark)
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀" : "☾";
}


/* ==========================================
   PRAYER TIMES
   ========================================== */

async function loadPrayerTimes() {

    const input =
        document.getElementById(
            "locationInput"
        );


    const location =
        input.value.trim();


    if (!location) {

        return;
    }


    document.getElementById(
        "locationText"
    ).textContent = location;


    document.getElementById(
        "prayerList"
    ).innerHTML =
        '<div class="empty">Loading prayer times...</div>';


    try {

        const parts =
            location.split(",");


        const city =
            parts[0].trim();


        const country =
            parts.slice(1).join(",").trim();


        const finalCountry =
            country || "Iraq";


        const url =
            "https://api.aladhan.com/v1/timingsByCity" +
            "?city=" +
            encodeURIComponent(city) +
            "&country=" +
            encodeURIComponent(finalCountry) +
            "&method=3";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Prayer API request failed"
            );

        }


        const result =
            await response.json();


        if (
            !result.data ||
            !result.data.timings
        ) {

            throw new Error(
                "Prayer data unavailable"
            );

        }


        displayPrayerTimes(
            result.data.timings
        );


    } catch (error) {

        console.error(
            "Prayer times error:",
            error
        );


        document.getElementById(
            "prayerList"
        ).innerHTML =
            '<div class="empty">Could not load prayer times.</div>';


        document.getElementById(
            "nextName"
        ).textContent =
            "Unavailable";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";
    }
}


function displayPrayerTimes(
    timings
) {

    const prayers = [

        ["Fajr", timings.Fajr],

        ["Dhuhr", timings.Dhuhr],

        ["Asr", timings.Asr],

        ["Maghrib", timings.Maghrib],

        ["Isha", timings.Isha]

    ];


    const list =
        document.getElementById(
            "prayerList"
        );


    list.innerHTML = "";


    prayers.forEach(
        function(prayer) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "prayer-item";


            const name =
                document.createElement(
                    "span"
                );

            name.textContent =
                prayer[0];


            const time =
                document.createElement(
                    "strong"
                );

            time.textContent =
                prayer[1];


            item.appendChild(name);

            item.appendChild(time);

            list.appendChild(item);

        }
    );


    updateNextPrayer(
        prayers
    );
}


function updateNextPrayer(
    prayers
) {

    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let next = null;


    for (
        let i = 0;
        i < prayers.length;
        i++
    ) {

        const time =
            prayers[i][1];


        const parts =
            time.split(":");


        const hours =
            Number(parts[0]);


        const minutes =
            Number(parts[1]);


        const prayerMinutes =
            hours * 60 + minutes;


        if (
            prayerMinutes >
            currentMinutes
        ) {

            next = prayers[i];

            break;
        }
    }


    if (!next) {

        next = prayers[0];

    }


    document.getElementById(
        "nextName"
    ).textContent =
        next[0];


    document.getElementById(
        "nextTime"
    ).textContent =
        next[1];
}


/* ==========================================
   NOTIFICATIONS
   ========================================== */

async function enableNotifications() {

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if (!("Notification" in window)) {

        status.textContent =
            "Notifications are not supported by this browser.";

        return;
    }


    try {

        const permission =
            await Notification.requestPermission();


        if (permission === "granted") {

            status.textContent =
                "Notifications are enabled.";

        } else {

            status.textContent =
                "Notifications are disabled.";

        }

    } catch (error) {

        console.error(
            "Notification error:",
            error
        );


        status.textContent =
            "Could not enable notifications.";
    }
}


/* ==========================================
   EVENT LISTENERS
   ========================================== */


/* Add task button */

document
    .getElementById("addTaskButton")
    .addEventListener(
        "click",
        addTask
    );


/* Enter key */

document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                addTask();

            }

        }
    );


/* Dark mode */

document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        toggleDarkMode
    );


/* Tabs */

document
    .querySelectorAll(".tab")
    .forEach(
        function(tab) {

            tab.addEventListener(
                "click",
                function() {

                    switchTab(
                        tab.dataset.tab
                    );

                }
            );

        }
    );


/* Prayer location */

document
    .getElementById(
        "updateLocationButton"
    )
    .addEventListener(
        "click",
        loadPrayerTimes
    );


/* Enter location */

document
    .getElementById(
        "locationInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                loadPrayerTimes();

            }

        }
    );


/* Notifications */

document
    .getElementById(
        "notificationButton"
    )
    .addEventListener(
        "click",
        enableNotifications
    );


/* ==========================================
   START APP
   ========================================== */

updateDate();

loadDarkMode();

loadTasks();

renderTasks();

/*
   Prayer loading is intentionally
   independent from the task system.
*/
loadPrayerTimes();

</script>
