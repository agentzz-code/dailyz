<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dailyz</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f7;
    color: #111;
}

button,
input {
    font-family: inherit;
}

/* =========================
   APP
========================= */

.app {
    width: min(700px, calc(100% - 32px));
    margin: 0 auto;
    padding: 25px 0 50px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
}

.date {
    margin-top: 5px;
    color: #777;
    font-size: 14px;
}

.icon-button {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #e5e5e7;
    color: #111;
    font-size: 20px;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    gap: 5px;
    padding: 5px;
    margin-bottom: 22px;
    border-radius: 13px;
    background: #e5e5e7;
}

.tab {
    flex: 1;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    background: transparent;
    color: #666;
    font-weight: 600;
}

.tab.active {
    background: white;
    color: #111;
}

/* =========================
   SECTIONS
========================= */

.section {
    display: none;
}

.section.active {
    display: block;
}

/* =========================
   TASK INPUT
========================= */

.task-input {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-bottom: 18px;
}

#taskInput {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    background: white;
    color: #111;
    font-size: 16px;
}

.add-button {
    width: 52px;
    height: 52px;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 28px;
}

/* =========================
   TASK LIST
========================= */

/*
   IMPORTANT:
   This is NOT a list.
   It uses plain DIV elements only.
*/

#taskList {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 9px;
}

.task-row {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 54px;
    padding: 12px 14px;
    border-radius: 13px;
    background: white;
}

/* Absolutely no generated content */
#taskList::before,
#taskList::after,
.task-row::before,
.task-row::after {
    content: none !important;
    display: none !important;
}

.task-check {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    margin: 0 12px 0 0;
}

.task-label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.task-row.done .task-label {
    text-decoration: line-through;
    opacity: .45;
}

.delete-task {
    width: 30px;
    height: 30px;
    padding: 0;
    margin-left: 8px;
    border: 0;
    background: transparent;
    font-size: 16px;
    opacity: .6;
}

.no-tasks {
    padding: 35px 10px;
    text-align: center;
    color: #888;
}

/* =========================
   PRAYER HEADER
========================= */

.prayer-header {
    margin-bottom: 18px;
}

.prayer-header h2 {
    margin: 0 0 5px;
}

.location {
    color: #777;
    font-size: 14px;
}

/* =========================
   NEXT PRAYER
========================= */

.next-prayer {
    padding: 23px;
    margin-bottom: 18px;
    border-radius: 18px;
    background: #111;
    color: white;
}

.next-label {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: .6;
}

.next-name {
    margin-top: 5px;
    font-size: 28px;
    font-weight: 700;
}

.next-time {
    margin-top: 2px;
    font-size: 38px;
    font-weight: 700;
}

/* =========================
   PRAYER LIST
========================= */

#prayerList {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 8px;
}

.prayer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    min-height: 52px;
    padding: 15px 16px;
    border-radius: 12px;
    background: white;
}

#prayerList::before,
#prayerList::after,
.prayer-row::before,
.prayer-row::after {
    content: none !important;
    display: none !important;
}

/* =========================
   SETTINGS
========================= */

.settings-card {
    margin-top: 20px;
    padding: 19px;
    border-radius: 16px;
    background: white;
}

.settings-title {
    margin-bottom: 13px;
    font-weight: 700;
}

.location-row {
    display: flex;
    gap: 8px;
}

#locationInput {
    flex: 1;
    min-width: 0;
    height: 45px;
    padding: 0 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
}

.small-button {
    height: 45px;
    padding: 0 16px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-weight: 600;
}

.notification-button {
    width: 100%;
    height: 45px;
    margin-top: 11px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-weight: 600;
}

.status {
    margin-top: 9px;
    color: #777;
    font-size: 13px;
}

/* =========================
   DARK MODE
========================= */

body.dark {
    background: #111214;
    color: white;
}

body.dark .date,
body.dark .location,
body.dark .status {
    color: #999;
}

body.dark .icon-button {
    background: #292a2f;
    color: white;
}

body.dark .tabs {
    background: #242529;
}

body.dark .tab {
    color: #aaa;
}

body.dark .tab.active {
    background: #383a40;
    color: white;
}

body.dark #taskInput {
    background: #1d1f23;
    color: white;
    border-color: #393b40;
}

body.dark .task-row {
    background: #1d1f23;
}

body.dark .prayer-row {
    background: #1d1f23;
}

body.dark .settings-card {
    background: #1d1f23;
}

body.dark #locationInput {
    background: #292b30;
    color: white;
    border-color: #393b40;
}

body.dark .next-prayer {
    background: #292b30;
}

</style>

</head>

<body>

</div>

<script>

/* =========================
   DATE
========================= */

function updateDate() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        });
}


/* =========================
   TASK DATA
========================= */

let tasks = [];


function loadTasks() {

    const saved =
        localStorage.getItem("dailyz_tasks");

    if (!saved) {
        tasks = [];
        return;
    }

    try {

        const parsed =
            JSON.parse(saved);

        if (Array.isArray(parsed)) {
            tasks = parsed;
        } else {
            tasks = [];
        }

    } catch {

        tasks = [];

    }
}


function saveTasks() {

    localStorage.setItem(
        "dailyz_tasks",
        JSON.stringify(tasks)
    );
}


/* =========================
   TASK RENDERING
========================= */

function renderTasks() {

    const container =
        document.getElementById("taskList");

    container.innerHTML = "";


    if (tasks.length === 0) {

        const message =
            document.createElement("div");

        message.className = "no-tasks";

        message.textContent =
            "No tasks yet. Add one above.";

        container.appendChild(message);

        return;
    }


    for (
        let index = 0;
        index < tasks.length;
        index++
    ) {

        const task =
            tasks[index];


        /* Plain DIV. No LI. No UL. No marker. */

        const row =
            document.createElement("div");

        row.className = "task-row";


        if (task.completed === true) {
            row.classList.add("done");
        }


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className =
            "task-check";

        checkbox.checked =
            task.completed === true;


        checkbox.addEventListener(
            "change",
            function() {

                tasks[index].completed =
                    checkbox.checked;

                saveTasks();

                renderTasks();

            }
        );


        const label =
            document.createElement("div");

        label.className =
            "task-label";

        label.textContent =
            task.text;


        const deleteButton =
            document.createElement("button");

        deleteButton.type = "button";

        deleteButton.className =
            "delete-task";

        deleteButton.textContent =
            "×";


        deleteButton.addEventListener(
            "click",
            function() {

                tasks.splice(index, 1);

                saveTasks();

                renderTasks();

            }
        );


        row.appendChild(checkbox);

        row.appendChild(label);

        row.appendChild(deleteButton);

        container.appendChild(row);

    }
}


/* =========================
   ADD TASK
========================= */

function addTask() {

    const input =
        document.getElementById("taskInput");


    const value =
        input.value.trim();


    if (value === "") {

        input.focus();

        return;
    }


    tasks.push({
        text: value,
        completed: false
    });


    saveTasks();

    renderTasks();

    input.value = "";

    input.focus();
}


/* =========================
   TABS
========================= */

const allTabs =
    document.querySelectorAll(".tab");


allTabs.forEach(function(tab) {

    tab.addEventListener(
        "click",
        function() {

            allTabs.forEach(
                function(otherTab) {

                    otherTab.classList.remove(
                        "active"
                    );

                }
            );


            document
                .querySelectorAll(".section")
                .forEach(
                    function(section) {

                        section.classList.remove(
                            "active"
                        );

                    }
                );


            tab.classList.add("active");


            const page =
                document.getElementById(
                    tab.dataset.page
                );


            page.classList.add("active");

        }
    );

});


/* =========================
   DARK MODE
========================= */

function loadDarkMode() {

    const enabled =
        localStorage.getItem(
            "dailyz_dark"
        ) === "true";


    document.body.classList.toggle(
        "dark",
        enabled
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        enabled ? "☀" : "☾";
}


function toggleDarkMode() {

    const enabled =
        !document.body.classList.contains(
            "dark"
        );


    document.body.classList.toggle(
        "dark",
        enabled
    );


    localStorage.setItem(
        "dailyz_dark",
        enabled
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        enabled ? "☀" : "☾";
}


/* =========================
   PRAYER DATA
========================= */

/*
   Verified times you provided
   from Katakani Bang:

   August 10, 2026
   Erbil, Iraq
*/

const prayerData = {

    "2026-08-10": {

        Fajr: "03:46",

        Dhuhr: "12:20",

        Asr: "16:01",

        Maghrib: "19:04",

        Isha: "20:19"

    }

};


function getTodayKey() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =========================
   PRAYER RENDER
========================= */

function loadPrayerTimes() {

    const key =
        getTodayKey();


    const data =
        prayerData[key];


    const container =
        document.getElementById(
            "prayerList"
        );


    container.innerHTML = "";


    if (!data) {

        const message =
            document.createElement("div");

        message.className =
            "no-tasks";

        message.textContent =
            "Prayer times are not available for this date yet.";

        container.appendChild(message);


        document.getElementById(
            "nextName"
        ).textContent =
            "Unavailable";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";


        return;
    }


    const prayers = [

        {
            name: "Fajr",
            time: data.Fajr
        },

        {
            name: "Dhuhr",
            time: data.Dhuhr
        },

        {
            name: "Asr",
            time: data.Asr
        },

        {
            name: "Maghrib",
            time: data.Maghrib
        },

        {
            name: "Isha",
            time: data.Isha
        }

    ];


    prayers.forEach(
        function(prayer) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "prayer-row";


            const name =
                document.createElement(
                    "span"
                );


            name.textContent =
                prayer.name;


            const time =
                document.createElement(
                    "strong"
                );


            time.textContent =
                prayer.time;


            row.appendChild(name);

            row.appendChild(time);

            container.appendChild(row);

        }
    );


    updateNextPrayer(prayers);
}


/* =========================
   NEXT PRAYER
========================= */

function updateNextPrayer(prayers) {

    const now =
        new Date();


    const current =
        now.getHours() * 60 +
        now.getMinutes();


    let next =
        null;


    for (
        let i = 0;
        i < prayers.length;
        i++
    ) {

        const parts =
            prayers[i].time.split(":");


        const minutes =
            Number(parts[0]) * 60 +
            Number(parts[1]);


        if (minutes > current) {

            next =
                prayers[i];

            break;
        }
    }


    if (next === null) {

        next =
            prayers[0];

    }


    document.getElementById(
        "nextName"
    ).textContent =
        next.name;


    document.getElementById(
        "nextTime"
    ).textContent =
        next.time;
}


/* =========================
   NOTIFICATIONS
========================= */

async function enableNotifications() {

    const status =
        document.getElementById(
            "notificationStatus"
        );


    if (!("Notification" in window)) {

        status.textContent =
            "Notifications are not supported.";

        return;
    }


    try {

        const permission =
            await Notification.requestPermission();


        if (permission === "granted") {

            status.textContent =
                "Notifications are enabled.";

        } else {

            status.textContent =
                "Notifications are disabled.";

        }

    } catch {

        status.textContent =
            "Notifications could not be enabled.";

    }
}


/* =========================
   BUTTONS
========================= */

document
    .getElementById("addTaskButton")
    .addEventListener(
        "click",
        addTask
    );


document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                addTask();

            }

        }
    );


document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        toggleDarkMode
    );


document
    .getElementById("updateLocationButton")
    .addEventListener(
        "click",
        function() {

            const location =
                document
                    .getElementById(
                        "locationInput"
                    )
                    .value
                    .trim();


            document.getElementById(
                "locationText"
            ).textContent =
                location ||
                "Erbil, Iraq";


            loadPrayerTimes();

        }
    );


document
    .getElementById("notificationButton")
    .addEventListener(
        "click",
        enableNotifications
    );


/* =========================
   START APP
========================= */

updateDate();

loadDarkMode();

loadTasks();

renderTasks();

loadPrayerTimes();

</script>

</body>
